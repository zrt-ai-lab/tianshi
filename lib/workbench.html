<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>天市</title>
<style>
  /* ══════════════════════════════════════════════════════════
     天市 · 星垣设计系统
     天市垣是三垣之一，古人把天上的市集命名于此，
     垣内星官有帝座、市楼、车肆、列肆、帛度。
     以浅色纸面为底，星垣图标与少量金蓝点缀；结构与配色分离。
     ══════════════════════════════════════════════════════════ */
  :root{
    /* 深空层 */
    --void:#F4F5F7;          /* 最底：夜空 */
    --bg:#F7F8FA;            /* 应用底色 */
    --layer:#FFFFFF;         /* 卡片层 */
    --layer2:#F0F3F8;        /* 次级卡片 */
    --surface:#F3F5F8;
    --surface2:#FAFBFC;
    --rise:#EDF2FA;          /* 悬停浮起 */

    /* 星线 */
    --border:#DCE2EB;
    --border-soft:#E9EDF3;
    --line:#C5CEDC;

    /* 文本：星等从亮到暗 */
    --fg:#202B3D;
    --fg2:#46556B;
    --fg3:#64748B;
    --cap:#728096;

    /* 声部 */
    --amber:#A87925;         /* 浑仪金：品牌主色 */
    --amber-dim:#765522;
    --cyan:#147D80;          /* 星芒青：数据高亮 */
    --accent:#356BC6;        /* 天极蓝：可交互 */
    --violet:#7560BF;

    /* A股语义（红涨绿跌，深色底提亮版） */
    --up:#D63C3C;
    --down:#198553;
    --warn:#986514;
    --hover:rgba(110,168,255,.09);

    --brand:#A87925;
    --brand-fg:#FFFFFF;

    /* 正文仿宋、重点黑体：
       --prose 华文仿宋，用于成段说明文字；
       --sans  苹方，用于数字、名称、按钮、标签、标题以及所有加粗的重点。
       同一行内两种字体只按文字基线混排（行内天然基线对齐），不在 flex 盒子上混用。 */
    --prose:"STFangsong","FangSong","FangSong_GB2312","仿宋",serif;
    --sans:"PingFang SC",-apple-system,BlinkMacSystemFont,"Microsoft YaHei",sans-serif;
    --font:var(--prose);
    --mono:var(--sans);

    --r-s:8px; --r-m:11px; --r-l:15px;
    /* 深色底的阴影要用更深的墨，不是黑色透明 */
    --shadow-s:0 1px 2px rgba(31,45,68,.04);
    --shadow-m:0 4px 16px -6px rgba(31,45,68,.10);
    --shadow-l:0 18px 48px -18px rgba(31,45,68,.16);
    /* 星图网格 */
    --grid:rgba(110,168,255,.045);
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--fg);
    font-family:var(--font);font-size:13px;line-height:1.5;
    -webkit-font-smoothing:antialiased;
    /* 星空底纹：两层网格 + 极淡的星云 */
    background-image:
      radial-gradient(1100px 620px at 78% -12%, rgba(110,168,255,.025), transparent 60%),
      radial-gradient(820px 520px at 8% 105%, rgba(232,180,76,.055), transparent 62%),
      linear-gradient(to right, var(--grid) 1px, transparent 1px),
      linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
    background-size:auto, auto, 56px 56px, 56px 56px;
    background-attachment:fixed;
  }
  ::selection{background:rgba(110,168,255,.28);color:#fff}
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:#CBD3DF;border-radius:99px;border:2px solid transparent;background-clip:padding-box}
  ::-webkit-scrollbar-thumb:hover{background:#AAB8CB;background-clip:padding-box}

  #app *{text-shadow:none}
  button,.chip,.pr-chip,.mktag,.mkidx,.ntbadge,.nav-item,.labtag,.prod,.glabel,.side-head{white-space:nowrap}
  .row .nm,.nav-item span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
  .row{line-height:1.4}

  /* ── 布局骨架 ── */
  #app{display:flex;flex-direction:column;height:100vh;overflow:hidden}
  .top{
    display:flex;align-items:center;gap:12px;height:50px;padding:0 16px;
    border-bottom:1px solid var(--border);flex:0 0 auto;
    background:rgba(255,255,255,.96);backdrop-filter:blur(14px) saturate(1.3);
    position:relative;z-index:20;
  }
  /* 顶上一条极细的星芒切线 */
  .top::after{
    content:'';position:absolute;left:0;right:0;bottom:-1px;height:1px;
    background:linear-gradient(90deg, transparent, rgba(232,180,76,.45), rgba(79,209,197,.35), transparent);
    pointer-events:none;
  }
  .main{display:flex;flex:1;min-height:0;overflow:hidden}

  .side{
    width:242px;flex:0 0 auto;border-right:1px solid var(--border-soft);
    display:flex;flex-direction:column;background:#F8F9FC;
    min-height:0;backdrop-filter:blur(6px);
  }
  .center{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;position:relative}
  .right{
    width:412px;flex:0 0 auto;border-left:1px solid var(--border);
    overflow-y:auto;padding:14px 16px 40px;background:#FFFFFF;
    backdrop-filter:blur(6px);
  }

  /* ── 品牌 ── */
  .brand{display:flex;flex-direction:column;gap:1px;flex:0 0 auto;cursor:pointer;user-select:none}
  .labline{display:flex;align-items:center;gap:8px}
  .prod{
    font-size:15px;font-weight:700;letter-spacing:.14em;color:var(--fg);
    /* 品牌字用极淡的金色描边，像刻在浑仪上的铭文 */
    text-shadow:0 0 18px rgba(232,180,76,.22);
  }
  .brandmark{
    width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;
    color:var(--amber);flex:0 0 auto;
  }
  .labtag{font-size:9.5px;color:var(--cap);letter-spacing:.16em;font-weight:500}
  .brandsub{font-size:9px;color:var(--cap);letter-spacing:.1em}

  /* ── 搜索 ── */
  .searchwrap{position:relative;flex:1;max-width:520px;margin:0 auto}
  .searchbox{
    display:flex;align-items:center;gap:8px;height:34px;padding:0 6px 0 11px;
    border:1px solid var(--border);border-radius:var(--r-m);
    background:#FFFFFF;transition:border-color .16s,box-shadow .16s,background .16s;
  }
  .searchbox:focus-within{
    border-color:rgba(110,168,255,.55);
    box-shadow:0 0 0 3px rgba(110,168,255,.10), 0 0 22px -6px rgba(110,168,255,.35);
    background:#FFFFFF;
  }
  .searchbox input{
    flex:1;border:0;background:transparent;color:var(--fg);font-size:12.5px;outline:none;
    font-family:var(--font);
  }
  .searchbox input::placeholder{color:var(--cap)}
  .searchbox button{
    height:24px;padding:0 11px;border:1px solid rgba(232,180,76,.35);border-radius:var(--r-s)!important;
    background:rgba(232,180,76,.12);color:var(--amber);cursor:pointer;font-size:11px;font-weight:600;
    transition:background .14s,border-color .14s;
  }
  .searchbox button:hover{background:rgba(232,180,76,.22);border-color:rgba(232,180,76,.6)}

  /* 下拉 */
  .dd{
    position:absolute;top:40px;left:0;right:0;z-index:40;display:none;
    background:#FFFFFF;border:1px solid var(--border);border-radius:var(--r-m);
    box-shadow:var(--shadow-l);overflow:hidden;padding:5px;max-height:340px;overflow-y:auto;
    backdrop-filter:blur(20px);
  }
  .dd-item{
    display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:var(--r-s);
    cursor:pointer;transition:background .1s;
  }
  .dd-item[data-on="1"],.dd-item:hover{background:var(--hover)}
  .dd-item b{font-size:12.5px;font-weight:500;color:var(--fg)}
  .dd-item i{font-size:10.5px;color:var(--cap);font-style:normal;font-family:var(--mono);margin-left:auto}
  .dd-item em{font-size:10px;color:var(--fg3);font-style:normal}

  /* ── 意图工具条 ── */
  .tools{display:flex;gap:6px;flex:0 0 auto;align-items:center}
  .seg{display:inline-flex;border:1px solid var(--border);border-radius:var(--r-s);overflow:hidden;background:#F2F5FA}
  .seg button{
    height:26px;padding:0 11px;border:0;background:transparent;color:var(--fg3);
    cursor:pointer;font-size:11px;transition:background .14s,color .14s;
  }
  .seg button[data-on="1"]{background:rgba(110,168,255,.16);color:var(--accent);font-weight:600}
  .seg button:hover:not([data-on="1"]){background:var(--hover);color:var(--fg2)}
  .ibtn{
    height:26px;min-width:28px;padding:0 7px;border:1px solid var(--border);border-radius:var(--r-s)!important;
    background:transparent;color:var(--fg3);cursor:pointer;font-size:12px;
    transition:background .14s,color .14s,border-color .14s;
  }
  .ibtn:hover{background:var(--hover);color:var(--fg);border-color:var(--line)}

  /* ── 卡片 ── */
  .card{
    border-radius:var(--r-m);border:1px solid var(--border-soft);
    background:#FFFFFF;padding:11px 13px;box-shadow:var(--shadow-s);
    transition:border-color .16s,background .16s;
  }
  .card:hover{border-color:var(--border)}

  /* ── 区间小标题 ── */
  .glabel{
    display:flex;align-items:center;gap:7px;padding:13px 2px 6px;
    font-size:10.5px;color:var(--fg3);letter-spacing:.09em;font-weight:600;text-transform:none;
  }
  .glabel::before{
    content:'';width:3px;height:10px;border-radius:2px;
    background:linear-gradient(180deg,var(--amber),rgba(232,180,76,.15));
  }

  /* ── 行情头 ── */
  /* 行情头：整行按文字基线对齐（不是按盒子底边），大小字号混排也在同一条线上；
     窄屏时名称一行、价格一行自然换行 */
  .quote{
    display:flex;align-items:baseline;column-gap:18px;row-gap:4px;padding:14px 20px 12px;
    flex:0 0 auto;flex-wrap:wrap;border-bottom:1px solid var(--border-soft);
    background:linear-gradient(180deg, rgba(242,245,250,.6), transparent);line-height:1.2;
  }
  .qname{display:flex;align-items:baseline;gap:8px;min-width:0;white-space:nowrap}
  .qname b{font-size:20px;font-weight:700;color:var(--fg);overflow:hidden;text-overflow:ellipsis}
  .qname span{font-size:12px;color:var(--cap)}
  .qprice{display:flex;align-items:baseline;gap:10px;white-space:nowrap}
  .qprice b{font-size:28px;font-weight:700;letter-spacing:-.01em;transition:color .2s}
  .qprice > span{font-size:14px;font-weight:600}
  .qclock{font-size:11px;color:var(--cap);font-weight:400}
  .qclock .live-dot{vertical-align:middle;margin-right:5px;position:relative;top:-1px}
  .qmeta{
    display:flex;column-gap:16px;row-gap:4px;flex-wrap:wrap;align-items:baseline;padding:7px 20px;font-size:11px;
    color:var(--fg3);border-bottom:1px solid var(--border-soft);flex:0 0 auto;line-height:1.4;
  }
  .qmeta > div{white-space:nowrap}

  /* ── 图表 ── */
  .chartwrap{flex:1;position:relative;min-height:0;overflow:hidden}
  .chartwrap canvas{display:block;width:100%;height:100%}
  .legend{
    display:flex;align-items:center;gap:10px;padding:5px 2px 3px;flex:0 0 auto;
    flex-wrap:nowrap;overflow-x:auto;white-space:nowrap;min-height:22px;
  }
  .legend::-webkit-scrollbar{display:none}
  .legend span,.legend b{font-size:10.5px}
  .rangebar{display:flex;gap:2px;align-items:center;flex:0 0 auto}
  .rangebar button{
    border:1px solid transparent;background:transparent;color:var(--fg3);
    cursor:pointer;font-size:10.5px;padding:4px 11px!important;
    border-radius:999px!important;transition:all .14s;
  }
  .rangebar button[data-on="1"]{
    background:rgba(110,168,255,.14);color:var(--accent);
    border-color:rgba(110,168,255,.3);font-weight:600;
  }
  .rangebar button:hover:not([data-on="1"]){background:var(--hover);color:var(--fg2)}

  /* ── 左侧列表 ── */
  .side-head{
    padding:13px 14px 6px;font-size:10px;font-weight:600;color:var(--cap);
    letter-spacing:.13em;display:flex;justify-content:space-between;align-items:center;
    text-transform:uppercase;
  }
  .side-list{overflow-y:auto;flex:1 1 auto;min-height:0;padding-bottom:8px}
  /* 主导航：与自选行同一套内缩圆角，图标统一为线性 SVG */
  .nav{display:flex;flex-direction:column;gap:2px;padding:10px 6px 6px;border-bottom:1px solid var(--border-soft)}
  .nav-item{display:flex;align-items:center;gap:9px;width:100%;height:34px;padding:0 10px;border:0;background:transparent;
    border-radius:var(--r-s)!important;color:var(--fg2);font-size:12.5px;cursor:pointer;text-align:left}
  .nav-item svg{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;color:var(--fg3)}
  .nav-item:hover{background:var(--hover);color:var(--fg)}
  .nav-item:hover svg{color:var(--fg2)}
  .nav-item[data-on="1"]{background:#FFF6E4;color:#7A5518;font-weight:600}
  .nav-item[data-on="1"] svg{color:#A87925}
  .wrow,.row{
    position:relative;display:flex;align-items:center;gap:8px;padding:7px 14px;
    cursor:pointer;transition:background .12s,color .12s;
  }
  .row{border-radius:var(--r-s);margin:0 6px;padding:7px 8px}
  .wrow::after{
    content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);
    width:2px;height:0;background:var(--amber);border-radius:0 2px 2px 0;
    transition:height .16s ease;
  }
  .wrow:hover::after{height:58%}
  .wrow:hover,.row:hover{background:var(--hover)}
  .wrow:active,.row:active{background:rgba(110,168,255,.14)}
  .wrow:hover .nm,.row:hover .nm{color:var(--accent)}
  /* 当前选中标的：琥珀光条 + 提亮 */
  .row[data-on="1"]{background:rgba(232,180,76,.10)}
  .row[data-on="1"] .nm{color:var(--amber);font-weight:600}
  .row[data-on="1"]::before{
    content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);
    width:2px;height:60%;background:var(--amber);border-radius:0 2px 2px 0;
  }
  .del{opacity:0;transition:opacity .12s;color:var(--cap);font-size:10px;padding:0 3px}
  .row:hover .del{opacity:.6}
  .del:hover{opacity:1;color:var(--up)}
  .nm{transition:color .12s;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pc{font-size:11px;font-weight:600;font-variant-numeric:tabular-nums;flex:0 0 auto;min-width:46px;text-align:right;font-family:var(--mono)}

  /* 可点行 */
  .clickable{position:relative;cursor:pointer;border-radius:var(--r-s);transition:background .12s,transform .08s}
  .clickable:hover{background:var(--hover)}
  .clickable:active{transform:scale(.996)}
  .clickable.is-tight::after{right:6px;font-size:12px}

  /* 折叠头 */
  .foldhead{
    cursor:pointer;transition:background .14s,border-color .14s;
    user-select:none;
  }
  .foldhead:hover{background:var(--rise);border-color:var(--line)!important}
  .foldhead:active{transform:scale(.998)}

  /* 胶囊 */
  .chip{
    cursor:pointer;transition:background .14s,border-color .14s,color .14s;
    background:transparent;color:var(--fg2);
  }
  .chip:hover{background:var(--hover);border-color:var(--line)}
  .chip[data-on="1"]{background:rgba(110,168,255,.18);color:var(--accent);border-color:rgba(110,168,255,.42)}
  .mktag,.mkidx,.ntbadge{border-radius:999px!important}

  /* ── 按钮 ── */
  button{
    font-family:var(--font);border-radius:var(--r-s)!important;
    transition:background .14s,border-color .14s,color .14s,transform .07s,box-shadow .14s;
  }
  button:active:not(:disabled){transform:translateY(1px)}
  button:disabled{opacity:.45;cursor:not-allowed}
  .primary{
    background:linear-gradient(180deg, rgba(232,180,76,.95), rgba(214,158,44,.95));
    color:#0A1020;border:1px solid rgba(232,180,76,.9);font-weight:650;
  }
  .primary:hover:not(:disabled){
    box-shadow:0 0 0 3px rgba(232,180,76,.14), 0 6px 20px -8px rgba(232,180,76,.6);
    filter:brightness(1.06);
  }
  .ghost{background:transparent;color:var(--fg2);border:1px solid var(--border)}
  .ghost:hover:not(:disabled){background:var(--hover);color:var(--fg);border-color:var(--line)}

  /* ── 决策徽章 ── */
  .verdict{
    display:inline-flex;align-items:center;gap:6px;padding:2px 10px;
    border-radius:999px;font-size:11px;font-weight:650;letter-spacing:.02em;
    transition:all .2s;
  }
  .up{color:var(--up)}
  .down{color:var(--down)}
  .flat{color:var(--fg3)}
  .warn{color:var(--warn)}

  /* ── 分项得分条 ── */
  .dimrow{display:flex;align-items:center;gap:9px;padding:5px 0;font-size:11px}
  .dn{width:64px;flex:0 0 auto;color:var(--fg2)}
  .dbar{
    flex:1;height:5px;background:#E8EDF4;border-radius:99px;overflow:hidden;
    position:relative;
  }
  .dbar i{
    display:block;height:100%;border-radius:99px;
    transition:width .5s cubic-bezier(.22,1,.36,1), background .3s;
    box-shadow:0 0 10px -2px currentColor;
  }
  .ds{width:26px;text-align:right;font-family:var(--mono);font-weight:600;flex:0 0 auto}
  .dimdetail{font-size:10px;color:var(--cap);padding:0 0 4px 73px;line-height:1.5}

  /* ── 键值行 ── */
  .plrow{display:flex;align-items:baseline;gap:10px;padding:4px 0;font-size:11px;line-height:1.55}
  .plrow i{font-style:normal;color:var(--cap);flex:0 0 auto;white-space:nowrap}
  .plrow b{font-weight:500;color:var(--fg2);text-align:right;margin-left:auto}
  .kv{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:4px 0;font-size:11px;line-height:1.5}
  .kv > :first-child{white-space:nowrap}
  .kv span{color:var(--cap)}
  .kv b{font-weight:500;color:var(--fg2);font-family:var(--mono)}

  /* ── 提示 ── */
  .caveat{
    font-size:10px;color:var(--cap);line-height:1.65;padding:8px 10px;
    border-left:2px solid rgba(232,180,76,.4);background:rgba(232,180,76,.04);
    border-radius:0 var(--r-s) var(--r-s) 0;
  }
  .warnbox{
    font-size:10.5px;line-height:1.6;padding:8px 11px;border-radius:var(--r-s);
    border:1px solid rgba(232,180,76,.3);background:rgba(232,180,76,.07);color:var(--warn);
  }
  .empty{
    padding:26px 22px;color:var(--fg3);font-size:12px;line-height:1.85;
    text-align:center;
  }
  .empty b{color:var(--fg2)}
  .stock-guide{margin:14px 0 0;padding:14px;text-align:left;border:1px solid var(--border-soft);border-radius:var(--r-m);background:var(--surface2)}
  .stock-guide h3{margin:0;font-family:var(--sans);font-size:12.5px;font-weight:600;color:var(--fg);line-height:1.5}
  .stock-guide > p{margin:4px 0 11px;font-size:11.5px;color:var(--fg3);line-height:1.6}
  .stock-guide ol{list-style:none;counter-reset:guide;margin:0;padding:0;display:grid;gap:10px}
  .stock-guide li{counter-increment:guide;position:relative;padding-left:25px;min-width:0;text-align:left}
  .stock-guide li::before{content:counter(guide,decimal-leading-zero);position:absolute;left:0;top:1px;font-family:var(--sans);font-size:10px;line-height:18px;color:var(--cap)}
  .stock-guide li strong{display:block;font-family:var(--sans);font-size:11.5px;font-weight:600;color:var(--fg2);line-height:1.5}
  .stock-guide li span{display:block;margin-top:2px;font-size:11px;line-height:1.6;color:var(--fg3);overflow-wrap:anywhere}

  /* ── 骨架 / 加载 ── */
  .sk,.boot-line,.row-skel{
    background-color:#E8ECF2;
    background-image:linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,.75) 50%, rgba(255,255,255,0) 100%);
    background-size:220px 100%;background-repeat:no-repeat;background-position:-220px 0;
    animation:shimmer 1.25s ease-in-out infinite;border-radius:6px;
  }
  .row-skel{height:11px;display:block}
  @keyframes shimmer{0%{background-position:-220px 0}100%{background-position:calc(100% + 220px) 0}}

  /* 加载中的说明条：告诉用户正在做什么 */
  .ld-head{display:flex;align-items:center;gap:9px;padding:11px 13px;margin-bottom:10px;border-radius:var(--r-m);
    background:#FFFBF2;border:1px solid #F0E2BF;color:#7A5518;font-size:12px}
  .ld-head b{font-weight:600}
  .ld-step{margin-left:auto;font-size:10.5px;color:#A98A50;transition:opacity .2s}
  .ld-dots::after{content:'';animation:lddots 1.2s steps(4,end) infinite}
  @keyframes lddots{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}

  /* 图表区加载：假 K 线轮廓 + 流光 */
  #chartSk{overflow:hidden;border-radius:var(--r-m);background:#F3F5F9}
  #chartSk .ck-bars{position:absolute;left:24px;right:70px;bottom:26px;top:46px;display:flex;align-items:flex-end;gap:5px}
  #chartSk .ck-bars i{flex:1;border-radius:3px;background:#E3E8EF;animation:ckpulse 1.4s ease-in-out infinite}
  @keyframes ckpulse{0%,100%{opacity:.55}50%{opacity:1}}
  #chartSk .ck-label{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);display:flex;align-items:center;gap:8px;
    padding:7px 14px;border-radius:999px;background:rgba(255,255,255,.9);border:1px solid var(--border);font-size:11.5px;color:var(--fg2);
    box-shadow:var(--shadow-m)}

  /* 数据到达：逐块上浮淡入，而不是「啪」一下出现 */
  @keyframes tsreveal{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .reveal > *{animation:tsreveal .42s cubic-bezier(.2,.9,.25,1) both}
  .reveal > *:nth-child(2){animation-delay:.04s}.reveal > *:nth-child(3){animation-delay:.08s}
  .reveal > *:nth-child(4){animation-delay:.12s}.reveal > *:nth-child(5){animation-delay:.16s}
  .reveal > *:nth-child(n+6){animation-delay:.2s}
  @keyframes tsfade{from{opacity:0}to{opacity:1}}
  canvas.reveal-cv{animation:tsfade .45s ease both}
  #progress{height:3px;background:linear-gradient(90deg,#D9A845,#6EA8FF);box-shadow:0 0 10px rgba(217,168,69,.55)}
  .spin{
    display:inline-block;width:11px;height:11px;border:1.6px solid rgba(110,168,255,.25);
    border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite;
    vertical-align:-1px;
  }
  @keyframes sp{to{transform:rotate(360deg)}}
  .boot-block{border:1px solid var(--border-soft);border-radius:var(--r-m);background:#FFFFFF;overflow:hidden}

  /* ── 动效 ── */
  .fade-swap{animation:tsfade .3s cubic-bezier(.22,1,.36,1)}
  @keyframes tsfade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  @keyframes tsk{0%,100%{opacity:.55}50%{opacity:1}}
  @keyframes tsbreathe{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-2px) scale(1.04)}}
  /* 数据跳动：价格更新时闪一下 */
  .tick{animation:tickflash .5s ease-out}
  @keyframes tickflash{0%{background:rgba(110,168,255,.22)}100%{background:transparent}}
  /* 星点呼吸：实时指示 */
  .live-dot{
    display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--down);
    box-shadow:0 0 0 0 rgba(47,191,113,.6);animation:pulse 2s infinite;
  }
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(47,191,113,.5)}
    70%{box-shadow:0 0 0 6px rgba(47,191,113,0)}
    100%{box-shadow:0 0 0 0 rgba(47,191,113,0)}
  }

  /* ── 妖股视图 ── */
  .mv-row{
    padding:11px 9px;margin:0 -9px;border-bottom:1px solid var(--border-soft);
    border-radius:var(--r-s);transition:background .14s,border-color .14s;
  }
  .mv-row:hover{background:var(--hover)}
  .mv-meta{display:flex;flex-wrap:wrap;gap:12px;margin-top:4px;font-size:10px;color:var(--fg3)}
  .mv-meta b{font-family:var(--mono);font-weight:600}
  .mv-why{margin-top:3px;font-size:10px;color:var(--fg3);line-height:1.55}
  .mv-risk{margin-top:2px;font-size:10px;color:var(--warn);line-height:1.55}
  .dc-note{
    font-size:10.5px;color:var(--cap);line-height:1.65;padding:8px 11px;
    border:1px solid var(--border-soft);border-radius:var(--r-s);
    background:#F8FAFC;margin-bottom:8px;
  }

  /* ── 表格 ── */
  .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--border-soft);
    border:1px solid var(--border-soft);border-radius:var(--r-m);overflow:hidden}
  .cell{background:#FFFFFF;padding:8px 10px}

  /* ── 启动遮罩 ── */
  #boot{
    position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;
    background:var(--bg);
    transition:opacity .4s ease,visibility .4s;

  .boot-mark{
    width:52px;height:52px;border-radius:15px;display:flex;align-items:center;justify-content:center;

    border:1px solid rgba(232,180,76,.34);
    box-shadow:0 0 0 1px rgba(232,180,76,.08), 0 20px 50px -18px rgba(232,180,76,.4);
    animation:tsbreathe 2.6s ease-in-out infinite;
  }

  /* ── 响应式 ── */
  .side.collapsed{display:none}
  .right.collapsed{display:none}
  @media (max-width:680px){

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
  }

  /* Structural contracts: independent of the visual theme. */
  .mktbar{display:flex;align-items:center;gap:8px;min-height:46px;padding:7px 16px;flex:0 0 auto;border-bottom:1px solid var(--border-soft);background:var(--surface);overflow-x:auto;white-space:nowrap;font-size:11px}

  .ntbadge b{display:block;flex:none;border-radius:50%}
  .top{height:auto;min-height:58px;flex-wrap:wrap;padding:10px 16px;row-gap:9px}
  .top .brand,.top .tools,.top .searchwrap{min-width:0}

  .brandmark svg{display:block;width:22px;height:22px;flex:none}
  .labline{white-space:nowrap}
  .segbtn[data-on="1"]{background:rgba(110,168,255,.16);color:var(--accent)}
  .chartwrap{display:flex;flex-direction:column}
  .chartwrap > .legend{position:relative;display:flex;justify-content:space-between;min-height:36px;padding:6px 12px;gap:12px;overflow-x:auto}
  .legend .ma{display:flex;align-items:center;gap:12px;white-space:nowrap}
  .chartwrap > canvas{flex:1 1 0;min-height:0;height:0;width:100%}
  .tip{position:absolute;display:none;pointer-events:none;z-index:20;padding:8px 11px;line-height:1.6;font-size:11px;white-space:nowrap;background:var(--layer);border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow-m)}
  .skline{position:absolute;inset:40px 8px 8px;display:none;z-index:6}
  .skline[data-on="1"]{display:block}
  .card{margin-bottom:8px}
  .cond{display:flex;align-items:flex-start;gap:9px;padding:9px 0;border-bottom:1px solid var(--border-soft)}
  .cond div{flex:1;min-width:0}.cond p{margin:0;line-height:1.5}.cond small{color:var(--cap)}
  .dot{width:16px;height:16px;display:flex;align-items:center;justify-content:center;flex:none;border-radius:50%;font-size:10px}
  .dot[data-ok="1"]{background:var(--hover);color:var(--cyan)}
  .prog{height:4px;background:var(--surface);overflow:hidden;border-radius:2px;margin-bottom:10px}.prog i{display:block;height:100%;background:var(--accent)}
  .gates{display:flex;flex-wrap:wrap;gap:5px}.gate{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border:1px solid;border-radius:20px;font-size:10px}.gate b{width:5px;height:5px;border-radius:50%}
  .why{display:flex;gap:7px;padding:5px 0;align-items:baseline;font-size:11.5px;line-height:1.55}.why .ic{width:15px;flex:none}.why .tx{flex:1;min-width:0}
  .foot{display:flex;align-items:center;gap:12px;flex:0 0 auto;min-height:28px;padding:5px 16px;border-top:1px solid var(--border-soft);font-size:10px;color:var(--cap);flex-wrap:wrap}.foot .sp{flex:1}.foot .lab{display:inline-flex;align-items:center;gap:5px}.foot .wm{opacity:.6}
  #progress{position:fixed;left:0;top:0;height:2px;width:0;z-index:999;pointer-events:none;background:var(--amber);opacity:0;transition:width .3s,opacity .3s}#progress[data-on="1"]{opacity:1}
  #toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);padding:10px 16px;max-width:90vw;background:var(--layer2);border:1px solid var(--border);border-radius:9px;color:var(--fg);opacity:0;pointer-events:none;z-index:99}#toast[data-on="1"]{opacity:1}
  #boot{flex-direction:column;gap:18px}.boot-text{font-size:12px;color:var(--fg3)}
  button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
  @media(max-width:1280px){.right{width:350px}.side{width:210px}}
  @media(max-width:980px){.main{flex-direction:column;overflow-y:auto}.side{display:none}.center{flex:none;min-height:480px;height:60vh}.right{width:100%;flex:none;overflow:visible;border-left:0;border-top:1px solid var(--border)}.top .searchwrap{max-width:none}}

  /* 侧栏：自选优先占高度，梯队其次；各自滚动 */
  #watchList{flex:1 1 0;min-height:180px}

  /* 连板梯队整页 */
  /* Each ladder level uses the available width; members reflow inside it. */
  /* Quiet segmented control, matching the light research workbench. */
  .ladder-group-toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .ladder-group-switch{display:inline-flex;align-items:center;gap:3px;padding:3px;border:1px solid var(--border-soft);border-radius:11px;background:var(--surface);max-width:100%}
  .ladder-group-switch button{appearance:none;display:inline-flex;align-items:center;justify-content:center;min-height:32px;padding:0 15px;border:1px solid transparent;border-radius:8px!important;background:transparent;color:var(--fg3);font-family:var(--sans);font-size:12px;font-weight:500;line-height:1.3;white-space:nowrap;cursor:pointer;transition:background .15s,color .15s,box-shadow .15s,border-color .15s}

  .lv-head{display:flex;align-items:baseline;gap:5px 8px;flex-wrap:wrap;padding:10px 12px;border-bottom:1px solid var(--border-soft);background:var(--surface2)}

  .lv-more{padding:7px 12px;font-size:11px;color:var(--accent);cursor:pointer;text-align:center}
  .lv-stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;background:var(--border-soft);
    border:1px solid var(--border-soft);border-radius:var(--r-m);overflow:hidden}

  /* 浮层窗口右上角有关闭按钮，给顶栏右侧留出位置 */

  /* 入场：首页各区块依次上浮淡入 */
  @keyframes tsrise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .rise > *{animation:tsrise .5s cubic-bezier(.2,.9,.25,1) both}
  .rise > *:nth-child(1){animation-delay:.02s}.rise > *:nth-child(2){animation-delay:.07s}
  .rise > *:nth-child(3){animation-delay:.12s}.rise > *:nth-child(4){animation-delay:.17s}
  .rise > *:nth-child(5){animation-delay:.22s}.rise > *:nth-child(n+6){animation-delay:.27s}

  .pr-lab{font-size:10.5px;color:var(--cap);letter-spacing:.06em;flex:none}
  .pr-chips{display:flex;flex-wrap:wrap;gap:6px}
  .pr-chip{height:26px;padding:0 11px;border:1px solid var(--border);border-radius:999px!important;background:var(--layer);
    color:var(--fg2);font-size:11.5px;cursor:pointer}
  .pr-chip:hover{border-color:#E3CF9F;background:#FFFBF2;color:var(--fg)}
  .pr-chip[data-on="1"]{border-color:#D9B66A;background:#FFF6E4;color:#7A5518;font-weight:600}
  .pr-body{font-size:11.5px;color:var(--fg2);line-height:1.65;padding:9px 12px;border-radius:var(--r-s);
    background:#FFFBF2;border:1px solid #F0E2BF}
  /* Brand anchor: always visible at the leading edge, including embedded views. */
  .top .brand{display:flex;order:-1;flex:0 0 auto;padding:2px 16px 2px 0;border-right:1px solid var(--border-soft)}
  .brand .labline{gap:10px;align-items:baseline}
  .brand .labline .brandmark{align-self:center}
  .brand .brandmark{width:36px;height:36px;border-radius:11px;background:#FFF7E7;border:1px solid #EDDCB7;color:#936A20}
  .brand .brandmark svg{width:29px;height:29px}
  .brand .prod{font-family:var(--font);font-size:21px;font-weight:600;letter-spacing:.08em;color:var(--fg);text-shadow:none}
  .brand .labtag{font-size:10px;letter-spacing:.06em;color:var(--fg3)}
  body{font-family:var(--prose);font-variant-numeric:tabular-nums}
  input,select,textarea,button{font-family:var(--sans)}
  /* 仿宋笔画细：正文略放大、加深、略加描边，保证可读 */
  body{font-size:13.5px;-webkit-text-stroke:.18px currentColor;letter-spacing:.01em}
  /* 界面元素、数字、名称：黑体 */
  .top,.mktbar,.side,.nav-item,.side-head,.row,.nm,.pc,.cd,.glabel,.quote,.qmeta,.legend,.rangebar,
  .chip,.pr-chip,.pr-lab,.mkidx,.mktag,.ntbadge,.seg,.labtag,.prod,.dimrow,.dn,.ds,.kv b,.plrow b,.cell,
  .mv-meta,.dd,.ld-head,.ck-label,#toast,.foot,canvas,.tip,.verdict,.dstage,.gate{
    font-family:var(--sans);-webkit-text-stroke:0;letter-spacing:0}
  /* 重点：凡加粗都换黑体，与仿宋正文形成对比 */
  b,strong,h1,h2,h3,h4,
  [style*="font-weight:600"],[style*="font-weight:650"],[style*="font-weight:700"],
  [style*="font-weight: 600"],[style*="font-weight: 700"]{
    font-family:var(--sans);-webkit-text-stroke:0;letter-spacing:0}
  b,strong{font-weight:600}
  .qname b{font-weight:600}
  @media(max-width:680px){.brand .labtag{display:none}.top .brand{padding-right:12px}}
</style>

<script>
(function () {
  'use strict';
  var API = '/api/tianshi';
  var LS_WATCH = 'tianshi:watchlist';
  var LS_LAST = 'tianshi:lastSymbol';
  var DEFAULT_WATCH = [
    { code: '600519', name: '贵州茅台' },
    { code: '000001', name: '平安银行' },
    { code: '300750', name: '宁德时代' },
    { code: '688981', name: '中芯国际' }
  ];
  var VERDICT = { watch: '观察', avoid: '回避', incomplete: '未完成', buy: '买入' };
  var DIR = { up: '看多', flat: '震荡', down: '看空', unknown: '未知' };
  var GATE_NAME = { data: '数据', consistency: '一致性', sample: '样本', counter: '反证', extreme: '极端值' };

  var state = { symbol: null, card: null, bars: [], minutes: [], flow: [], preClose: null, lmt: 250, mode: (function () {
    try { var m = new URLSearchParams(location.search).get('mode'); return m === 'day' ? 'day' : 'min'; } catch (e) { return 'min'; }
  })(), quotes: {} };

  function $(id) { return document.getElementById(id); }
  function pct(v, d) { return (v === null || v === undefined || isNaN(v)) ? '—' : Number(v).toFixed(d === undefined ? 2 : d) + '%'; }
  function num(v, d) { return (v === null || v === undefined || isNaN(v)) ? '—' : Number(v).toFixed(d === undefined ? 2 : d); }
  function money(v) {
    if (v === null || v === undefined) return '—';
    var a = Math.abs(v);
    if (a >= 1e8) return (v / 1e8).toFixed(2) + '亿';
    if (a >= 1e4) return (v / 1e4).toFixed(2) + '万';
    return Math.round(v) + '';
  }
  function chgCls(v) { return v > 0 ? 'up' : v < 0 ? 'down' : 'flat'; }
  function toast(msg) {
    var t = $('toast'); t.textContent = msg; t.dataset.on = '1';
    clearTimeout(t._t); t._t = setTimeout(function () { t.dataset.on = '0'; }, 1800);
  }
  function setProgress(on) {
    var el = $('progress');
    if (!el) return;
    if (on) { el.dataset.on = '1'; el.style.width = '18%';
      el._t1 = setTimeout(function(){ el.style.width = '58%'; }, 320);
      el._t2 = setTimeout(function(){ el.style.width = '82%'; }, 1100);
    } else {
      clearTimeout(el._t1); clearTimeout(el._t2);
      el.style.width = '100%';
      setTimeout(function(){ el.dataset.on = '0'; setTimeout(function(){ el.style.width = '0'; }, 240); }, 120);
    }
  }
  function knownName(symbol) {
    var w = (typeof watch !== 'undefined' ? watch : []).find(function (x) { return x.code === symbol; });
    if (w && w.name) return w.name;
    try {
      var lv = (ladderState && ladderState.ladder && ladderState.ladder.levels) || [];
      for (var i = 0; i < lv.length; i++) {
        var hit = (lv[i].items || []).find(function (x) { return x.code === symbol; });
        if (hit) return hit.name;
      }
    } catch (e) {}
    var dd = document.querySelectorAll('#dd .dd-item');
    for (var j = 0; j < dd.length; j++) {
      if ((dd[j].querySelector('i') || {}).textContent === symbol) return (dd[j].querySelector('b') || {}).textContent;
    }
    return '';
  }
  function chartSkeleton(on, label) {
    var el = $('chartSk');
    if (!el) return;
    if (on) {
      var bars = '';
      for (var i = 0; i < 42; i++) {
        var h = 18 + Math.round((Math.sin(i / 3.2) * 0.5 + 0.5) * 46 + (i % 5) * 4);
        bars += '<i style="height:' + h + '%;animation-delay:' + (i * 0.03).toFixed(2) + 's"></i>';
      }
      el.innerHTML = '<div class="ck-bars">' + bars + '</div>' +
        '<div class="ck-label"><span class="spin"></span>正在载入' + (label ? ' ' + label + ' ' : '') + '走势<span class="ld-dots"></span></div>';
    }
    el.dataset.on = on ? '1' : '0';
  }
  function quoteSkeleton(symbol, name) {
    $('quote').innerHTML = '<div class="qname" style="gap:10px">' +
      (name ? '<b>' + name + '</b>' : '<div class="sk" style="width:110px;height:20px"></div>') +
      '<span>' + (symbol || '') + '</span></div>' +
      '<div class="qprice"><div class="sk" style="width:104px;height:28px"></div><div class="sk" style="width:58px;height:14px"></div></div>';
    $('qmeta').innerHTML = Array(7).fill(0).map(function (_, i) {
      return '<div class="sk" style="width:' + (62 + (i % 3) * 14) + 'px;height:11px"></div>';
    }).join('');
  }
  // 触发逐块入场：先移除再重排，保证每次都播放
  function reveal(el) {
    if (!el) return;
    el.classList.remove('reveal'); void el.offsetWidth; el.classList.add('reveal');
  }
  function api(path) {
    return fetch(API + path).then(function (r) {
      return r.text().then(function (t) {
        try { return JSON.parse(t); }
        catch (e) {
          throw new Error('接口 ' + path + ' 未就绪 —— host 插件可能是旧版本，请完全退出并重开 DeepSeek Harness');
        }
      });
    });
  }

  /* ── 自选 ── */
  function loadWatch() {
    try {
      var raw = localStorage.getItem(LS_WATCH);
      if (!raw) return DEFAULT_WATCH.slice();
      var a = JSON.parse(raw);
      return Array.isArray(a) ? a.filter(function (x) { return x && /^\d{6}$/.test(x.code); }) : DEFAULT_WATCH.slice();
    } catch (e) { return DEFAULT_WATCH.slice(); }
  }
  function saveWatch(list) {
    try { localStorage.setItem(LS_WATCH, JSON.stringify(list.slice(0, 30))); } catch (e) {}
  }
  var watch = loadWatch();

  /* 星芒色阶：把涨跌幅映射成左侧一段微光条 */
  function sparkBar(pct) {
    if (pct == null || isNaN(pct)) return '';
    var w = Math.min(30, Math.abs(pct) * 4);
    var col = pct > 0 ? 'var(--up)' : pct < 0 ? 'var(--down)' : 'var(--cap)';
    return '<span style="position:absolute;left:0;top:50%;transform:translateY(-50%);height:60%;width:' + w +
      '%;max-width:30%;background:linear-gradient(90deg,' + col + '22,transparent);pointer-events:none;border-radius:2px"></span>';
  }

  function renderWatch() {
    var box = $('watchList');
    box.innerHTML = '';
    $('watchCount').textContent = watch.length;
    watch.forEach(function (w) {
      var row = document.createElement('div');
      row.className = 'row';
      if (w.code === state.symbol) row.dataset.on = '1';
      var q = state.quotes[w.code];
      var pv = q && q.pct !== null && q.pct !== undefined ? q.pct : null;
      row.innerHTML = sparkBar(pv) +
        '<span class="nm" style="flex:1;min-width:0">' + (w.name || w.code) + '</span>' +
        '<span class="cd" style="font-size:10px;color:var(--cap);font-family:var(--mono);flex:0 0 auto">' + w.code + '</span>' +
        (pv !== null ? '<span class="pc ' + chgCls(pv) + '">' + pct(pv, 1) + '</span>' : '<span class="pc flat">—</span>') +
        '<span class="del" title="移除">✕</span>';
      row.addEventListener('click', function (e) {
        if (e.target.className === 'del') {
          e.stopPropagation();
          watch = watch.filter(function (x) { return x.code !== w.code; });
          saveWatch(watch); renderWatch(); return;
        }
        $('q').value = w.code; load(w.code);
      });
      box.appendChild(row);
    });
  }

  function renderHot(items) {
    var box = $('hotList');
    box.innerHTML = '';
    items.forEach(function (h) {
      var row = document.createElement('div');
      row.className = 'row';
      if (h.code === state.symbol) row.dataset.on = '1';
      row.innerHTML = '<span class="nm">' + h.name + '</span>' +
        '<span class="cd">' + h.code + '</span>' +
        '<span class="pc ' + chgCls(h.pct) + '">' + pct(h.pct, 1) + '</span>';
      row.addEventListener('click', function () { $('q').value = h.code; load(h.code); });
      box.appendChild(row);
      state.quotes[h.code] = { pct: h.pct };
    });
  }

  /* ── 搜索下拉 ── */
  var dd = $('dd'), ddItems = [], ddIdx = -1, ddTimer = null, ddSeq = 0;
  function hideDd() { dd.style.display = 'none'; dd.innerHTML = ''; ddItems = []; ddIdx = -1; }
  function paintDd() {
    Array.prototype.forEach.call(dd.children, function (c, i) { c.dataset.on = i === ddIdx ? '1' : '0'; });
  }
  function showDd(items, q) {
    dd.innerHTML = ''; ddItems = items; ddIdx = items.length ? 0 : -1;
    if (!items.length) {
      dd.innerHTML = '<div class="dd-item" style="cursor:default;color:var(--cap);line-height:1.6">没有匹配「' + q + '」的 A 股<br>' +
        '<span style="font-size:10px">已查全市场 5900+ 只（代码/名称/拼音）。若仍找不到，试试输入代码前六位</span></div>';
      dd.style.display = 'block'; return;
    }
    items.forEach(function (it, i) {
      var d = document.createElement('div');
      d.className = 'dd-item';
      var mktTag = it.market ? '<span style="font-size:9.5px;color:var(--cap);border:1px solid var(--border);border-radius:4px;padding:0 4px;margin-left:4px">' + it.market + '</span>' : '';
      d.innerHTML = '<b>' + it.name + '</b>' + mktTag + '<i>' + it.code + '</i>' + (it.pinyin ? '<em>' + it.pinyin + '</em>' : '');
      d.addEventListener('mouseenter', function () { ddIdx = i; paintDd(); });
      d.addEventListener('click', function () { $('q').value = it.code; hideDd(); load(it.code); });
      dd.appendChild(d);
    });
    dd.style.display = 'block'; paintDd();
  }
  function showSearching() {
    dd.innerHTML = '<div class="dd-item" style="cursor:default;color:var(--cap);gap:8px">' +
      '<span class="sk" style="width:12px;height:12px;border-radius:50%"></span>搜索中…</div>';
    dd.style.display = 'block';
  }
  function search(q) {
    var seq = ++ddSeq;
    showSearching();
    api('/search?q=' + encodeURIComponent(q)).then(function (j) {
      if (seq !== ddSeq) return;
      if (j && j.ok) showDd(j.items || [], q);
    }).catch(hideDd);
  }

  $('q').addEventListener('input', function (e) {
    var q = e.target.value.trim();
    clearTimeout(ddTimer);
    if (!q) { hideDd(); return; }
    ddTimer = setTimeout(function () { search(q); }, 200);
  });
  $('q').addEventListener('blur', function () { setTimeout(hideDd, 150); });
  $('q').addEventListener('keydown', function (e) {
    var open = dd.style.display !== 'none' && ddItems.length;
    if (e.key === 'ArrowDown' && open) { e.preventDefault(); ddIdx = (ddIdx + 1) % ddItems.length; paintDd(); }
    else if (e.key === 'ArrowUp' && open) { e.preventDefault(); ddIdx = (ddIdx - 1 + ddItems.length) % ddItems.length; paintDd(); }
    else if (e.key === 'Enter') {
      e.preventDefault();
      if (open && ddIdx >= 0) { var it = ddItems[ddIdx]; $('q').value = it.code; hideDd(); load(it.code); }
      else { hideDd(); submit(); }
    } else if (e.key === 'Escape') hideDd();
  });
  $('go').addEventListener('click', submit);
  function submit() {
    var v = $('q').value.trim();
    if (!v) return;
    if (/^\d{6}$/.test(v)) { load(v); return; }
    api('/search?q=' + encodeURIComponent(v)).then(function (j) {
      var first = j && j.ok ? (j.items || [])[0] : null;
      if (!first) { toast('找不到「' + v + '」'); return; }
      $('q').value = first.code; load(first.code);
    });
  }

  $('refresh').addEventListener('click', function () { if (state.symbol) load(state.symbol, true); });
  $('openTab').addEventListener('click', function () {
    window.open(location.pathname, '_blank');
  });
  Array.prototype.forEach.call(document.querySelectorAll('.rangebar button'), function (b) {
    b.addEventListener('click', function () {
      if (b.dataset.mode) {
        state.mode = b.dataset.mode;
        if (state.mode !== 'min') stopMinTimer();
        Array.prototype.forEach.call(document.querySelectorAll('.rangebar button[data-mode]'), function (x) { x.dataset.on = '0'; });
        b.dataset.on = '1';
        Array.prototype.forEach.call(document.querySelectorAll('.rangebar button.dayonly'), function (x) {
          x.style.opacity = state.mode === 'day' ? '1' : '.38';
        });
      } else if (b.dataset.lmt) {
        state.lmt = Number(b.dataset.lmt);
        Array.prototype.forEach.call(document.querySelectorAll('.rangebar button[data-lmt]'), function (x) { x.dataset.on = '0'; });
        b.dataset.on = '1';
        state.mode = 'day';
        Array.prototype.forEach.call(document.querySelectorAll('.rangebar button[data-mode]'), function (x) { x.dataset.on = x.dataset.mode === 'day' ? '1' : '0'; });
      }
      if (state.symbol) loadChart();
    });
  });
  Array.prototype.forEach.call(document.querySelectorAll('.rangebar button.dayonly'), function (x) { x.style.opacity = '.38'; });

  /* ── 图表：分时 / 日K ── */
  var cv = $('cv'), ctx = cv.getContext('2d');
  var hover = null;

  function resize() {
    var r = cv.parentElement.getBoundingClientRect();
    var dpr = window.devicePixelRatio || 1;
    cv.width = Math.max(10, Math.floor(r.width * dpr));
    cv.height = Math.max(10, Math.floor((r.height - 30) * dpr));
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw();
  }
  window.addEventListener('resize', resize);

  function ma(values, n) {
    var out = new Array(values.length).fill(null), sum = 0;
    for (var i = 0; i < values.length; i++) {
      sum += values[i];
      if (i >= n) sum -= values[i - n];
      if (i >= n - 1) out[i] = sum / n;
    }
    return out;
  }

  function chartColors() {
    var css = getComputedStyle(document.documentElement);
    return {
      line: css.getPropertyValue('--border-soft').trim() || 'rgba(0,0,0,.06)',
      up: css.getPropertyValue('--up').trim() || '#ec1313',
      down: css.getPropertyValue('--down').trim() || '#22c55e',
      cap: css.getPropertyValue('--cap').trim() || '#adb2b8',
      fg3: css.getPropertyValue('--fg3').trim() || '#81858c',
      font: css.getPropertyValue('--sans').trim() || 'sans-serif'
    };
  }

  function draw() {
    if (state.mode === 'min') drawIntraday(); else drawDay();
  }

  /* 分时图：价格线 + 均价线 + 昨收基准 + 量能 */
  function drawIntraday() {
    var w = cv.width / (window.devicePixelRatio || 1);
    var h = cv.height / (window.devicePixelRatio || 1);
    ctx.clearRect(0, 0, w, h);
    var pts = state.minutes;
    if (!pts || !pts.length) { $('legend').innerHTML = ''; return; }
    var C = chartColors();
    var padL = 10, padR = 58, padT = 20, axisH = 15;
    var inner = h - padT - axisH;
    var priceH = inner * 0.60;
    var volH = inner * 0.20;
    var flowH = inner * 0.155;
    var gapV = 6, gapF = 6;
    var volTop = padT + priceH + gapV;
    var flowTop = volTop + volH + gapF;
    var plotW = w - padL - padR;

    var pre = state.preClose;
    var prices = pts.map(function (p) { return p.close; });
    var avgs = pts.map(function (p) { return p.avg; }).filter(function (v) { return v > 0; });
    var hi = Math.max.apply(null, prices.concat(avgs.length ? avgs : prices));
    var lo = Math.min.apply(null, prices.concat(avgs.length ? avgs : prices));
    if (pre) { hi = Math.max(hi, pre); lo = Math.min(lo, pre); }
    var span = Math.max(hi - (pre || hi), (pre || lo) - lo);
    if (!(span > 0)) span = Math.max(Math.abs(hi - lo), (pre || hi) * 0.01);
    hi = (pre || hi) + span * 1.08;
    lo = (pre || lo) - span * 1.08;

    function X(i) { return padL + (i / Math.max(1, pts.length - 1)) * plotW; }
    function Y(p) { return padT + (hi - p) / (hi - lo) * priceH; }

    // 量能：均量线与最大量
    var vols = pts.map(function (p) { return p.volume || 0; });
    var vma = [];
    var sumV = 0;
    for (var vi = 0; vi < vols.length; vi++) {
      sumV += vols[vi];
      if (vi >= 20) sumV -= vols[vi - 20];
      vma.push(vi >= 19 ? sumV / 20 : null);
    }
    var maxVol = Math.max.apply(null, vols) || 1;
    function YV(v) { return volTop + volH - (v / maxVol) * volH; }

    // 资金流：按时间对齐
    var flow = state.flow || [];
    var flowByTime = {};
    flow.forEach(function (f) {
      var hm = (f.t || '').split(' ')[1];
      if (hm) flowByTime[hm] = f;
    });
    var mainSeries = pts.map(function (p) {
      var hm = (p.t || '').split(' ')[1];
      var f = flowByTime[hm];
      return f && Number.isFinite(f.main) ? f.main : null;
    });
    var smallSeries = pts.map(function (p) {
      var hm = (p.t || '').split(' ')[1];
      var f = flowByTime[hm];
      return f && Number.isFinite(f.small) ? f.small : null;
    });
    var flowMax = 1;
    mainSeries.concat(smallSeries).forEach(function (v) { if (v != null) flowMax = Math.max(flowMax, Math.abs(v)); });
    function YF(v) { return flowTop + flowH / 2 - (v / flowMax) * (flowH / 2) * 0.92; }

    // ── 价格面板 ──
    ctx.strokeStyle = C.line; ctx.lineWidth = 1; ctx.font = '10px ' + C.font;
    for (var g = 0; g <= 4; g++) {
      var gy = padT + (priceH / 4) * g;
      ctx.beginPath(); ctx.moveTo(padL, gy); ctx.lineTo(w - padR, gy); ctx.stroke();
      var price = hi - (hi - lo) * (g / 4);
      ctx.fillStyle = pre && price > pre ? C.up : pre && price < pre ? C.down : C.cap;
      ctx.fillText(price.toFixed(2), w - padR + 6, gy + 3);
    }
    if (pre) {
      ctx.strokeStyle = C.cap; ctx.globalAlpha = .5; ctx.setLineDash([4, 4]);
      ctx.beginPath(); ctx.moveTo(padL, Y(pre)); ctx.lineTo(w - padR, Y(pre)); ctx.stroke();
      ctx.setLineDash([]); ctx.globalAlpha = 1;
    }
    if (avgs.length) {
      ctx.strokeStyle = 'rgba(245,158,11,.95)'; ctx.lineWidth = 1.1; ctx.beginPath();
      var started = false;
      for (var a = 0; a < pts.length; a++) {
        if (!(pts[a].avg > 0)) continue;
        var ax = X(a), ay = Y(pts[a].avg);
        if (!started) { ctx.moveTo(ax, ay); started = true; } else ctx.lineTo(ax, ay);
      }
      ctx.stroke();
    }
    var lastP = prices[prices.length - 1];
    var upCol = pre && lastP >= pre ? C.up : C.down;
    ctx.strokeStyle = upCol; ctx.lineWidth = 1.4; ctx.beginPath();
    for (var i2 = 0; i2 < pts.length; i2++) {
      var px = X(i2), py = Y(pts[i2].close);
      if (i2 === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.stroke();
    var grad = ctx.createLinearGradient(0, padT, 0, padT + priceH);
    grad.addColorStop(0, upCol.replace(')', ',.14)').replace('rgb(', 'rgba('));
    grad.addColorStop(1, 'transparent');
    ctx.lineTo(X(pts.length - 1), padT + priceH);
    ctx.lineTo(X(0), padT + priceH);
    ctx.closePath();
    ctx.fillStyle = grad;
    try { ctx.fill(); } catch (e) {}

    // ── 量能面板：柱 + 20 均量线 + 放量标记 ──
    var bw = plotW / Math.max(1, pts.length);
    var bigCount = 0;
    for (var k = 0; k < pts.length; k++) {
      var pv = pts[k];
      var prev = k > 0 ? pts[k - 1].close : (pre || pv.close);
      ctx.fillStyle = pv.close >= prev ? C.up : C.down;
      ctx.globalAlpha = .34;
      var yv = YV(vols[k]);
      ctx.fillRect(X(k), yv, Math.max(1, bw * .8), volTop + volH - yv);
      ctx.globalAlpha = 1;
      // 放量标记：当前分钟量 > 20 均量 2.5 倍
      if (vma[k] && vols[k] > vma[k] * 2.5) {
        bigCount++;
        ctx.fillStyle = 'rgba(245,158,11,.95)';
        ctx.beginPath();
        ctx.moveTo(X(k), yv - 5); ctx.lineTo(X(k) - 2.5, yv - 1); ctx.lineTo(X(k) + 2.5, yv - 1);
        ctx.closePath(); ctx.fill();
      }
    }
    // 均量线
    ctx.strokeStyle = 'rgba(99,110,130,.85)'; ctx.lineWidth = 1; ctx.beginPath();
    var vStarted = false;
    for (var vm = 0; vm < vma.length; vm++) {
      if (vma[vm] === null) continue;
      var vx = X(vm), vy = YV(vma[vm]);
      if (!vStarted) { ctx.moveTo(vx, vy); vStarted = true; } else ctx.lineTo(vx, vy);
    }
    ctx.stroke();
    ctx.fillStyle = C.cap; ctx.font = '9px ' + C.font;
    ctx.fillText('量能（灰线＝20分钟均量）', padL, volTop + 9);

    // ── 资金流面板：累计主力 vs 散户 ──
    ctx.strokeStyle = C.line;
    ctx.beginPath(); ctx.moveTo(padL, flowTop); ctx.lineTo(w - padR, flowTop); ctx.stroke();
    var zeroY = flowTop + flowH / 2;
    ctx.strokeStyle = 'rgba(0,0,0,.12)';
    ctx.beginPath(); ctx.moveTo(padL, zeroY); ctx.lineTo(w - padR, zeroY); ctx.stroke();
    // 散户（小单）虚线
    ctx.strokeStyle = 'rgba(130,140,155,.7)'; ctx.setLineDash([3, 3]); ctx.lineWidth = 1; ctx.beginPath();
    var sStarted = false;
    for (var si = 0; si < smallSeries.length; si++) {
      if (smallSeries[si] === null) continue;
      var sx = X(si), sy = YF(smallSeries[si]);
      if (!sStarted) { ctx.moveTo(sx, sy); sStarted = true; } else ctx.lineTo(sx, sy);
    }
    ctx.stroke();
    ctx.setLineDash([]);
    // 主力实线 + 填充
    var lastMain = null;
    ctx.strokeStyle = 'rgba(217,48,37,.95)'; ctx.lineWidth = 1.4; ctx.beginPath();
    var mStarted = false;
    for (var mi = 0; mi < mainSeries.length; mi++) {
      if (mainSeries[mi] === null) continue;
      var mx = X(mi), my = YF(mainSeries[mi]);
      if (!mStarted) { ctx.moveTo(mx, my); mStarted = true; } else ctx.lineTo(mx, my);
      lastMain = mainSeries[mi];
    }
    ctx.stroke();
    ctx.fillStyle = C.cap; ctx.font = '9px ' + C.font; ctx.fillText('资金', padL, flowTop + 9);

    // 时间轴
    ctx.fillStyle = C.cap; ctx.textAlign = 'center';
    var stepN = Math.max(1, Math.floor(pts.length / 5));
    for (var ti = 0; ti < pts.length; ti += stepN) {
      var tt = (pts[ti].t || '').split(' ')[1] || '';
      ctx.fillText(tt.slice(0, 5), X(ti), h - 3);
    }
    ctx.textAlign = 'left';

    if (hover !== null && hover >= 0 && hover < pts.length) {
      ctx.strokeStyle = C.cap; ctx.globalAlpha = .6; ctx.setLineDash([3, 3]);
      ctx.beginPath(); ctx.moveTo(X(hover), padT); ctx.lineTo(X(hover), h - axisH); ctx.stroke();
      ctx.setLineDash([]); ctx.globalAlpha = 1;
    }

    // ── 图例：价格 + 量能状态 + 资金 ──
    var lastVol = vols[vols.length - 1];
    var lastMa = vma[vma.length - 1];
    var volState = lastMa ? (lastVol > lastMa * 2 ? '放量' : lastVol < lastMa * 0.6 ? '缩量' : '平稳') : '—';
    var volColor = volState === '放量' ? 'var(--up)' : volState === '缩量' ? 'var(--down)' : 'var(--fg3)';
    var yi = function (v) { return v == null ? '—' : (v >= 0 ? '+' : '') + (v / 1e8).toFixed(2) + '亿'; };
    var lastSmall = null;
    for (var q2 = smallSeries.length - 1; q2 >= 0; q2--) { if (smallSeries[q2] !== null) { lastSmall = smallSeries[q2]; break; } }
    var liveNow = isTradingNow();
    var upd = $('legend').getAttribute('data-updated') || '';
    $('legend').innerHTML =
      '<span style="color:' + (liveNow ? 'var(--up)' : 'var(--cap)') + '">' + (liveNow ? '●' : '○') + '</span>' +
      '<span style="color:var(--cap);font-size:10px">' + (liveNow ? '实时' : '收盘') + '</span>' +
      '<b class="live-clock" style="color:var(--cap);font-size:10px;font-weight:400;font-family:var(--mono)">' + new Date().toLocaleTimeString('zh-CN', { hour12: false }) + '</b>' +
      '<span style="color:' + (pre && lastP >= pre ? C.up : C.down) + '"><b>价</b> ' + lastP.toFixed(2) + '</span>' +
      '<span style="color:' + volColor + '"><b>量能</b> ' + volState + (lastMa ? ' ' + (lastVol / lastMa).toFixed(1) + '×' : '') + (bigCount ? ' 放量' + bigCount : '') + '</span>' +
      '<span style="color:' + (lastMain >= 0 ? C.up : C.down) + '"><b>主力</b> ' + yi(lastMain) + '</span>' +
      '<span style="color:var(--fg3)"><b>散户</b> ' + yi(lastSmall) + '</span>';
  }


  /* 日K */
  function drawDay() {
    var w = cv.width / (window.devicePixelRatio || 1);
    var h = cv.height / (window.devicePixelRatio || 1);
    ctx.clearRect(0, 0, w, h);
    var bars = state.bars;
    if (!bars.length) { $('legend').innerHTML = ''; return; }
    var C = chartColors();
    var padL = 10, padR = 58, padT = 22, gap = 22, axisH = 16;
    var volH = Math.max(38, (h - padT - gap) * 0.17);
    var plotW = w - padL - padR, plotH = h - padT - volH - gap - axisH;

    var closes = bars.map(function (b) { return b.close; });
    var m5 = ma(closes, 5), m20 = ma(closes, 20), m60 = ma(closes, 60);
    var hi = -Infinity, lo = Infinity;
    bars.forEach(function (b) { if (b.high > hi) hi = b.high; if (b.low < lo) lo = b.low; });
    var pad = (hi - lo) * 0.08; hi += pad; lo -= pad;
    var maxVol = Math.max.apply(null, bars.map(function (b) { return b.volume || 0; })) || 1;
    var bw = plotW / bars.length;
    var cw = Math.max(1, Math.min(bw * 0.68, 12));
    function X(i) { return padL + (i + 0.5) * bw; }
    function Y(p) { return padT + (hi - p) / (hi - lo) * plotH; }
    function YV(v) { return h - axisH - (v / maxVol) * volH; }

    ctx.strokeStyle = C.line; ctx.lineWidth = 1; ctx.font = '10px ' + C.font; ctx.fillStyle = C.cap;
    for (var g = 0; g <= 4; g++) {
      var y = padT + (plotH / 4) * g;
      ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(w - padR, y); ctx.stroke();
      ctx.fillText((hi - (hi - lo) * (g / 4)).toFixed(2), w - padR + 6, y + 3);
    }
    for (var i = 0; i < bars.length; i++) {
      var b = bars[i];
      var up = b.close >= b.open;
      ctx.strokeStyle = up ? C.up : C.down; ctx.fillStyle = up ? C.up : C.down;
      var x = X(i);
      ctx.beginPath(); ctx.moveTo(x, Y(b.high)); ctx.lineTo(x, Y(b.low)); ctx.stroke();
      var yo = Y(b.open), yc = Y(b.close);
      ctx.fillRect(x - cw / 2, Math.min(yo, yc), cw, Math.max(1, Math.abs(yc - yo)));
    }
    function line(arr, color) {
      ctx.strokeStyle = color; ctx.lineWidth = 1.2; ctx.beginPath();
      var started = false;
      for (var i3 = 0; i3 < arr.length; i3++) {
        if (arr[i3] === null) continue;
        var x3 = X(i3), y3 = Y(arr[i3]);
        if (!started) { ctx.moveTo(x3, y3); started = true; } else ctx.lineTo(x3, y3);
      }
      ctx.stroke();
    }
    line(m5, 'rgba(65,118,230,.95)');
    line(m20, 'rgba(245,158,11,.9)');
    line(m60, 'rgba(139,92,246,.85)');
    for (var k = 0; k < bars.length; k++) {
      var bb = bars[k];
      ctx.fillStyle = bb.close >= bb.open ? C.up : C.down;
      ctx.globalAlpha = 0.35;
      var yv2 = YV(bb.volume || 0);
      ctx.fillRect(X(k) - cw / 2, yv2, cw, (h - axisH) - yv2);
      ctx.globalAlpha = 1;
    }
    if (hover !== null && hover >= 0 && hover < bars.length) {
      ctx.strokeStyle = C.cap; ctx.globalAlpha = .6; ctx.setLineDash([3, 3]);
      ctx.beginPath(); ctx.moveTo(X(hover), padT); ctx.lineTo(X(hover), h - axisH); ctx.stroke();
      var hy = Y(bars[hover].close);
      ctx.beginPath(); ctx.moveTo(padL, hy); ctx.lineTo(w - padR, hy); ctx.stroke();
      ctx.setLineDash([]); ctx.globalAlpha = 1;
    }
    ctx.fillStyle = C.cap; ctx.textAlign = 'center';
    var stepN2 = Math.max(1, Math.floor(bars.length / 6));
    for (var di = 0; di < bars.length; di += stepN2) {
      var dstr = (bars[di].date || '').slice(2);
      if (dstr) ctx.fillText(dstr, X(di), h - 4);
    }
    ctx.textAlign = 'left';
    /* 买卖点标注：把本机记录的成交打在 K 线上 */
    try {
      var myTrades = getTrades().filter(function (t) { return t.symbol === state.symbol; });
      if (myTrades.length) {
        var idxByDate = {};
        for (var bi = 0; bi < bars.length; bi++) idxByDate[bars[bi].date] = bi;
        myTrades.forEach(function (t) {
          var d2 = new Date(t.at);
          var ds = d2.getFullYear() + '-' + String(d2.getMonth() + 1).padStart(2, '0') + '-' + String(d2.getDate()).padStart(2, '0');
          var i2 = idxByDate[ds];
          if (i2 == null) return;
          var mx = X(i2), isBuy = t.side === 'buy';
          var my = isBuy ? Y(bars[i2].low) + 16 : Y(bars[i2].high) - 16;
          ctx.fillStyle = isBuy ? C.up : C.down;
          ctx.beginPath();
          if (isBuy) { ctx.moveTo(mx, my - 7); ctx.lineTo(mx - 4, my + 1); ctx.lineTo(mx + 4, my + 1); }
          else { ctx.moveTo(mx, my + 7); ctx.lineTo(mx - 4, my - 1); ctx.lineTo(mx + 4, my - 1); }
          ctx.closePath(); ctx.fill();
          ctx.font = 'bold 9px ui-monospace, Menlo, monospace';
          ctx.textAlign = 'center';
          ctx.fillText(isBuy ? 'B' : 'S', mx, isBuy ? my - 10 : my + 15);
          ctx.textAlign = 'left';
        });
      }
    } catch (e) { /* 标注失败不影响图表 */ }

    $('legend').innerHTML =
      '<span><b style="color:rgba(65,118,230,.95)">MA5</b> ' + (m5[m5.length - 1] == null ? '—' : m5[m5.length - 1].toFixed(2)) + '</span>' +
      '<span><b style="color:rgba(245,158,11,.9)">MA20</b> ' + (m20[m20.length - 1] == null ? '—' : m20[m20.length - 1].toFixed(2)) + '</span>' +
      '<span><b style="color:rgba(139,92,246,.85)">MA60</b> ' + (m60[m60.length - 1] == null ? '—' : m60[m60.length - 1].toFixed(2)) + '</span>';
  }

  cv.addEventListener('mousemove', function (e) {
    var r = cv.getBoundingClientRect();
    var x = e.clientX - r.left, y = e.clientY - r.top;
    var padL = 10, padR = 58;
    var plotW = r.width - padL - padR;
    var list = state.mode === 'min' ? state.minutes : state.bars;
    if (!list || !list.length) return;
    var pad = state.mode === 'min' ? 0 : 0.5;
    var n = state.mode === 'min' ? Math.max(1, list.length - 1) : list.length;
    var bw = state.mode === 'min' ? plotW / n : plotW / n;
    var i = state.mode === 'min'
      ? Math.round((x - padL) / (plotW / Math.max(1, list.length - 1)))
      : Math.floor((x - padL) / bw);
    if (i < 0 || i >= list.length) { hover = null; $('tip').style.display = 'none'; draw(); return; }
    hover = i; draw();
    var tip = $('tip');
    if (state.mode === 'min') {
      var p = list[i];
      var hm = (p.t || '').split(' ')[1];
      var fAt = null;
      (state.flow || []).forEach(function (f) { if (f && (f.t || '').split(' ')[1] === hm) fAt = f; });
      var yi2 = function (v) { return v == null ? '—' : (v >= 0 ? '+' : '') + (v / 1e8).toFixed(2) + '亿'; };
      tip.innerHTML = '<b>' + p.t + '</b><br>价 ' + p.close + '　均价 ' + (p.avg > 0 ? p.avg.toFixed(2) : '—') +
        '<br>量 ' + (p.volume ? (p.volume / 1e4).toFixed(1) + '万手' : '—') +
        (state.preClose ? '<br>较昨收 ' + (((p.close - state.preClose) / state.preClose) * 100).toFixed(2) + '%' : '') +
        (fAt ? '<br>主力 ' + yi2(fAt.main) + '　散户 ' + yi2(fAt.small) : '');
    } else {
      var b = list[i];
      tip.innerHTML = '<b>' + b.date + '</b><br>开 ' + b.open + '　高 ' + b.high +
        '<br>低 ' + b.low + '　收 ' + b.close +
        '<br>量 ' + (b.volume ? (b.volume / 1e4).toFixed(1) + '万手' : '—');
    }
    tip.style.display = 'block';

  function maEndN(arr, n) { if (arr.length < n) return null; var w = arr.slice(-n); return w.reduce(function(a, b) { return a + b; }, 0) / n; }
  function atrPctN(bars, n) {
    n = n || 14;
    if (!Array.isArray(bars) || bars.length < n + 1) return null;
    var w = bars.slice(-(n + 1)), trs = [];
    for (var i = 1; i < w.length; i++) {
      var c = w[i], pr = w[i - 1];
      trs.push(Math.max(c.high - c.low, Math.abs(c.high - pr.close), Math.abs(c.low - pr.close)));
    }
    var atr = trs.reduce(function(a, b) { return a + b; }, 0) / trs.length;
    var last = bars[bars.length - 1].close;
    return last ? (atr / last) * 100 : null;
  }

    if (!t || !['buy', 'sell'].includes(t.side)) throw new Error('请选择买入或卖出');
    if (!Number.isFinite(t.price) || t.price <= 0) throw new Error('成交价必须是正数');
    if (!Number.isSafeInteger(t.qty) || t.qty <= 0) throw new Error('成交股数必须是正整数');
    var held = pos && Number.isSafeInteger(pos.qty) ? pos.qty : 0;

  }
  function addTrade(t) {
    validateTrade(t, getPosition(t.symbol));

    var pos = getPosition(t.symbol) || { qty: 0, cost: 0 };
    if (t.side === 'buy') {

  /* 复盘归因：FIFO 配对，算出每笔卖出对应的买入成本与真实盈亏 */
  function fifoMatch() {
    var trades = getTrades().slice().sort(function (a, b) { return a.at - b.at; });
    var lots = {};
    var matched = [];
    trades.forEach(function (t) {
      if (t.side === 'buy') {
        if (!lots[t.symbol]) lots[t.symbol] = [];
        lots[t.symbol].push({ qty: t.qty, price: t.price, at: t.at });
      } else {
        var remain = t.qty;
        var q = lots[t.symbol] || [];
        while (remain > 0 && q.length) {
          var lot = q[0];
          var take = Math.min(remain, lot.qty);
          matched.push({
            symbol: t.symbol, name: t.name || t.symbol,
            buy_at: lot.at, sell_at: t.at, qty: take,
            buy: lot.price, sell: t.price,
            pnl: (t.price - lot.price) * take,
            pnl_pct: lot.price ? ((t.price - lot.price) / lot.price) * 100 : 0,
            hold_days: Math.max(0, Math.round((t.at - lot.at) / 86400000)),
          });
          lot.qty -= take; remain -= take;
          if (lot.qty <= 0) q.shift();
        }
        lots[t.symbol] = q;
      }
    });
    return matched;
  }

  function reviewStats() {
    var m = fifoMatch();

    var total = closed.length;
    var wins = closed.filter(function (x) { return x.pnl > 0; });

    var sumWin = wins.reduce(function (a, x) { return a + x.pnl; }, 0);
    var sumLoss = losses.reduce(function (a, x) { return a + x.pnl; }, 0);
    var avgHold = total ? closed.reduce(function (a, x) { return a + x.hold_days; }, 0) / total : 0;
    return {
      closed: closed,
      total: total,
      win_count: wins.length,
      lose_count: losses.length,
      win_rate: total ? (wins.length / total) * 100 : null,
      total_pnl: closed.reduce(function (a, x) { return a + x.pnl; }, 0),
      avg_win: wins.length ? sumWin / wins.length : null,
      avg_loss: losses.length ? sumLoss / losses.length : null,
      profit_factor: sumLoss !== 0 ? Math.abs(sumWin / sumLoss) : null,
      avg_hold: avgHold,
      best: closed.length ? closed.reduce(function (a, x) { return (a.pnl > x.pnl ? a : x); }) : null,

  function paintRegulatoryEvidence(box, symbol) {

  /* ── Tab 1：决策 ── */
  function paintDecision(box, p, d, r) {
    // This renderer is not nested in renderRight: keep its view model local.
    var baseStyle = STAGE[d.verdict] || STAGE.unknown;
    var st = { label: d.rule_label || d.label || baseStyle.label, color: baseStyle.color };
    var totalCol = d.total_reliable === false ? 'var(--cap)' : st.color;
    var k = p.card || {};
    var stg = p.stage;
    var op = p.opinion;
    var price = (p.quote || {}).price ?? null;
    var pos = getPosition(p.symbol);
    var alerts = getAlerts(p.symbol);

    /* ⓿ 今日盘面：分时表现、资金、做T 一屏看完 */
    paintTodayBoard(box, p);
    paintRegulatoryEvidence(box, p.symbol);

    /* ① 持仓建议（后端结合成本算的） */
    var pa = p.position_advice;
    if (pa) {
      var paColor = pa.action === 'cut' ? 'var(--down)' : pa.action === 'reduce' || pa.action === 'take_profit' ? 'var(--warn)' : 'var(--up)';
      box.appendChild(glabel('你的持仓', pa.label));
      var pac = document.createElement('div');
      pac.className = 'card';
      pac.style.padding = '11px 13px';
      var h = '<div style="display:flex;align-items:baseline;gap:9px">' +
        '<span style="font-size:12.5px;font-weight:650;color:' + paColor + '">' + pa.label + '</span>' +
        '<b style="margin-left:auto;font-family:var(--mono);font-size:15px;color:' + (pa.pnl_pct >= 0 ? 'var(--up)' : 'var(--down)') + '">' +
        (pa.pnl_pct >= 0 ? '+' : '') + pa.pnl_pct + '%</b></div>' +
        '<div style="font-size:11px;color:var(--fg2);margin-top:6px;line-height:1.6">' + pa.headline + '</div>';
      if ((pa.actions || []).length) {
        h += '<div style="margin-top:7px;padding-top:6px;border-top:1px solid var(--border-soft)">' +
          pa.actions.map(function (x) { return '<div style="font-size:10.5px;color:var(--fg3);line-height:1.6">· ' + x + '</div>'; }).join('') + '</div>';
      }
      if (pa.levels) {
        h += '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;margin-top:7px;font-size:10.5px">' +
          '<div><div style="color:var(--cap)">止损</div><b style="font-family:var(--mono);color:var(--down)">' + pa.levels.stop + '</b></div>' +
          '<div><div style="color:var(--cap)">止盈</div><b style="font-family:var(--mono);color:var(--up)">' + pa.levels.take_profit + '</b></div>' +
          '<div><div style="color:var(--cap)">保本</div><b style="font-family:var(--mono)">' + pa.levels.breakeven + '</b></div></div>';
      }
      if ((pa.warnings || []).length) {
        h += '<div style="margin-top:6px">' + pa.warnings.map(function (x) {
          return '<div style="font-size:10px;color:var(--warn);line-height:1.55">! ' + x + '</div>';
        }).join('') + '</div>';
      }
      pac.innerHTML = h;
      box.appendChild(pac);
    }

    /* 备用：本地简单盈亏（后端未返回建议时） */
    if (!pa && pos && price) {
      var pnl = (price - pos.cost) * pos.qty;
      var pnlPct = pos.cost ? ((price - pos.cost) / pos.cost) * 100 : 0;
      var cls2 = pnl >= 0 ? 'up' : 'down';
      box.appendChild(glabel('我的持仓', '本地保存 · AI分析会发送成本上下文'));
      var pc0 = document.createElement('div');
      pc0.className = 'card';
      pc0.style.padding = '10px 12px';
      pc0.innerHTML = '<div style="display:flex;align-items:baseline;gap:10px">' +
        '<span style="font-size:12px;color:var(--fg3)">成本 ' + pos.cost.toFixed(2) + ' × ' + pos.qty + ' 股</span>' +
        '<b class="' + cls2 + '" style="margin-left:auto;font-size:16px;font-family:var(--mono)">' +
        (pnl >= 0 ? '+' : '') + pnl.toFixed(0) + ' 元</b>' +
        '<b class="' + cls2 + '" style="font-size:12px;font-family:var(--mono)">(' + (pnlPct >= 0 ? '+' : '') + pnlPct.toFixed(2) + '%)</b></div>' +
        '<div style="margin-top:6px;font-size:10.5px;color:var(--cap)">市值 ' + (price * pos.qty).toFixed(0) + ' 元　成本合计 ' + (pos.cost * pos.qty).toFixed(0) + ' 元</div>';
      box.appendChild(pc0);
    }

    /* ② 一句话结论（唯一必须看的东西） */
    //
    // 规则引擎的档位与理由是这个产品的核心结论，不能被 AI 文案盖掉。
    // 现在的层次：档位徽章 + 规则理由（必须看）→ AI 展开（可选读）。
    box.appendChild(glabel('结论', op ? (op.action_tag || '') : ''));
    var main = document.createElement('div');
    main.className = 'card';
    main.style.padding = '13px 14px';
    var ruleTitle = d.headline || '';
    var ruleWhy = d.why_not || '';
    var aiTitle = op ? (op.title || '') : '';
    var aiStance = op && op.paragraphs ? (op.paragraphs.find(function (x) { return x.label === '这笔钱该怎么做'; }) || {}).text : (d.stance || '');
    var badge = '<span style="display:inline-block;font-size:10.5px;padding:1px 8px;border-radius:999px;' +
      'border:1px solid ' + st.color + ';color:' + st.color + ';margin-right:7px;vertical-align:1px">' + st.label + '</span>';
    var html2 = '<div style="font-size:14px;font-weight:650;line-height:1.5;color:var(--fg)">' + badge + (ruleTitle || aiTitle) + '</div>';
    if (ruleWhy) {
      html2 += '<div style="font-size:11.5px;color:var(--fg2);line-height:1.6;margin-top:7px">' + ruleWhy + '</div>';
    }
    if (aiStance) {
      html2 += '<div style="font-size:11.5px;color:var(--fg2);line-height:1.6;margin-top:6px;padding-top:6px;border-top:1px dashed var(--border-soft)">' +

    if (d.total_reliable === false) {

        '⚠ 数据覆盖率仅 ' + (d.coverage != null ? d.coverage : '—') + '%，总分只反映少数维度，不能与其他股票横比</div>';
    }
    main.innerHTML = html2;
    box.appendChild(main);

    /* ③ 三个关键数字 */
    var nums = document.createElement('div');
    nums.style.cssText = 'display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--border-soft);border:1px solid var(--border-soft);border-radius:var(--r-m);overflow:hidden;margin-bottom:10px';
    var rd0 = d.risk_detail || {};
    var bestRR = null;
    (function () {
      var rt = realtimeCache[p.symbol];
      if (rt && rt.pathways && rt.pathways.best_rr) bestRR = rt.pathways.best_rr;
    })();
    function numCell(label, val, color) {
      var c = document.createElement('div');
      c.style.cssText = 'background:var(--layer);padding:8px 10px';
      c.innerHTML = '<div style="font-size:10px;color:var(--cap)">' + label + '</div>' +
        '<div style="font-size:13px;font-weight:600;font-family:var(--mono);margin-top:2px;color:' + (color || 'var(--fg)') + '">' + val + '</div>';
      return c;
    }
    nums.appendChild(numCell('综合分' + (d.total_reliable === false ? '（低覆盖）' : ''),
      d.total === null ? '—' : String(d.total),
      d.total_reliable === false ? 'var(--cap)' : totalCol));
    nums.appendChild(numCell('风险等级', 'R' + (rd0.level ?? r.level ?? '?'), (rd0.level >= 4 ? 'var(--warn)' : 'var(--fg)')));
    nums.appendChild(numCell('仓位上限', (rd0.position_cap_pct ?? '—') + '%'));
    var rrCell = numCell('最好赔率', bestRR ? bestRR.rr + ' 倍' : '…', 'var(--fg)');
    rrCell.id = 'rrCell';
    nums.appendChild(rrCell);
    box.appendChild(nums);
    // 赔率是异步取的，回来后就地更新
    getRealtime(p.symbol).then(function (rt) {
      var el = $('rrCell');
      if (!el || !rt || !rt.pathways || !rt.pathways.best_rr) return;
      var b2 = rt.pathways.best_rr;
      el.innerHTML = '<div style="font-size:10px;color:var(--cap)">最好赔率</div>' +
        '<div style="font-size:13px;font-weight:600;font-family:var(--mono);margin-top:2px;color:' + (b2.rr >= 2 ? 'var(--up)' : 'var(--fg)') + '">' + b2.rr + ' 倍</div>';
    }).catch(function () {});

    /* ⑤ 折叠区：默认全部收起，需要时再展开 */
    box.appendChild(foldBlock(false, '完整投研结论', '长周期/基本面/估值/政策/资金', function (host) {
      if (!op || !op.paragraphs) { host.innerHTML = '<div class="caveat">暂无</div>'; return; }
      (op.paragraphs || []).forEach(function (pg) {

        row.style.cssText = 'padding:8px 0;border-bottom:1px solid var(--border-soft)';
        var tone = pg.tone === 'good' ? 'var(--up)' : pg.tone === 'caution' ? 'var(--warn)' : 'var(--fg2)';
        row.innerHTML = '<div style="font-size:10.5px;color:var(--cap);margin-bottom:3px">' + pg.label + '</div>' +
          '<div style="font-size:11.5px;line-height:1.6;color:' + tone + '">' + pg.text.replace(/\*\*(.+?)\*\*/g, '<b style="color:var(--fg)">$1</b>') + '</div>';
        host.appendChild(row);
      });
    }));

    box.appendChild(foldBlock(true, '怎么才能赚', '短线/中线/长线三条路径', function (host) {
      host.innerHTML = '<div class="caveat">加载中…</div>';

        (rt.pathways.pathways || []).forEach(function (item) {

              '<div><span style="color:var(--cap)">目标 </span><b style="font-family:var(--mono);color:var(--up)">' + (item.target == null ? '—' : item.target) + '</b></div></div>';

          adopt.addEventListener('click', function () {

    }));

    box.appendChild(foldBlock(false, '风险为什么是 R' + (rd0.level ?? '—'), (rd0.triggers || []).length ? rd0.triggers[0].slice(0, 22) : '', function (host) {
      var rc = document.createElement('div');
      rc.className = 'card';
      rc.style.padding = '10px 12px';
      var html = '<div style="display:flex;align-items:baseline;gap:10px">' +
        '<span style="font-family:var(--mono);font-size:18px;font-weight:600">R' + (rd0.level ?? '—') + '</span>' +
        '<span style="font-size:10.5px;color:var(--fg3)">仓位上限 ' + (rd0.position_cap_pct ?? '—') + '%　止损 ' + (rd0.stop_loss_pct ?? '—') + '%</span></div>';

      }

        sc.style.padding = '10px 12px';
        sc.innerHTML = '<div style="font-size:12px;font-weight:600">' + stg.stage.name + ' <span style="font-size:10px;color:var(--cap);font-weight:400">量价阶段</span></div>' +

  /* ── Tab：数据来源与交叉验证 ── */
  var sourcesCache = null;
  /* ── 链路：大盘 → 板块 → 海外映射 → 个股自身 ── */
  var chainCache = {};
  function paintChain(box, p) {
    var sym = p.symbol;
    var holder = document.createElement('div');
    box.appendChild(holder);
    if (chainCache[sym]) { renderChain(holder, chainCache[sym]); return; }
    holder.innerHTML = '<div class="ld-head"><span class="spin"></span><b>正在拆解涨跌根因</b>' +
      '<span class="ld-step">对比大盘、板块与海外映射的近 120 日走势<span class="ld-dots"></span></span></div>' +
      '<div class="card"><div class="row-skel" style="width:60%;margin-bottom:8px"></div><div class="row-skel" style="width:90%;margin-bottom:8px"></div><div class="row-skel" style="width:75%"></div></div>' +
      '<div class="card"><div class="row-skel" style="width:40%;margin-bottom:8px"></div><div class="row-skel" style="width:85%"></div></div>';
    api('/rootcause?symbol=' + encodeURIComponent(sym)).then(function (r) {
      if (!r || !r.ok) { holder.innerHTML = '<div class="card">根因链路暂不可用：' + ((r && r.error) || '接口未返回') + '</div>'; return; }
      chainCache[sym] = r;
      if (state.symbol !== sym) return;
      renderChain(holder, r);
    }).catch(function (e) {
      holder.innerHTML = '<div class="card">根因链路暂不可用：' + (e && e.message ? e.message : e) + '<br><span style="color:var(--cap)">若刚升级过，需要完全退出 DeepSeek Harness 再打开</span></div>';
    });
  }

  function chainNum(v, unit) {
    if (v === null || v === undefined || isNaN(v)) return '<span style="color:var(--cap)">—</span>';
    var cls = v > 0 ? 'up' : v < 0 ? 'down' : 'flat';
    return '<b class="' + cls + '">' + (v > 0 ? '+' : '') + Number(v).toFixed(2) + (unit || '%') + '</b>';
  }

  function renderChain(holder, r) {
    holder.innerHTML = '';
    var on = r.ontology || {};
    /* ① 产业链定位 */
    holder.appendChild(glabel('产业链定位', on.nodes && on.nodes.length ? '本体匹配' : ''));
    var c1 = document.createElement('div');
    c1.className = 'card';
    if (on.nodes && on.nodes.length) {
      c1.innerHTML = on.nodes.map(function (n) {
        return '<div style="margin-bottom:8px"><b>' + n.name + '</b>' +
          '<span style="font-size:10px;color:var(--cap);margin-left:6px">' + (n.via === 'industry' ? '按所属行业' : '按概念细化') + '</span>' +
          '<div style="margin-top:3px;line-height:1.6">' + n.chain + '</div>' +
          '<div style="font-size:11px;color:var(--fg3);margin-top:3px">海外映射：' + n.drivers.join('、') + '</div>' +
          '<div style="font-size:11px;color:var(--fg3)">需关注：' + n.factors.join('、') + '</div></div>';
      }).join('');
    } else if (on.domestic) {
      c1.innerHTML = '<b>主要驱动在国内</b><div style="margin-top:3px;line-height:1.6">' + on.domestic.reason + '，没有可靠的海外映射标的。</div>';
    } else {
      c1.innerHTML = '<div style="line-height:1.6">所属行业「' + (r.industry || '—') + '」暂未收录进产业链本体，只做大盘与板块归因。</div>';
    }
    holder.appendChild(c1);

    if (!r.engine_ok) {
      var w = document.createElement('div'); w.className = 'card';
      w.innerHTML = '根因链路无法计算：' + (r.reason || '数据不足');
      holder.appendChild(w); return;
    }
    var lk = r.links, dc = r.decomposition, mc = r.main_cause;

    /* ② 涨跌拆解：今日 / 近5日 / 近20日 */
    holder.appendChild(glabel('涨跌拆解', '近 ' + r.window + ' 日回归'));
    var c2 = document.createElement('div');
    c2.className = 'card';
    var periods = [['today', '今日'], ['d5', '近 5 日'], ['d20', '近 20 日']];
    var sel = window.__chainPeriod || 'today';
    function drawDecomp() {
      var x = dc[sel];
      var parts = [
        ['大盘带动', x.market, lk.market.name + ' β=' + lk.market.beta],
        ['板块带动', x.sector, lk.sector ? lk.sector.name + ' β=' + lk.sector.beta : '板块数据缺失'],
        ['个股自身', x.own, '消息 / 资金 / 题材'],
      ];
      var maxAbs = Math.max.apply(null, parts.map(function (q) { return Math.abs(q[1] || 0); }).concat([0.01]));
      c2.innerHTML =
        '<div style="display:flex;gap:6px;margin-bottom:10px">' + periods.map(function (pp) {
          return '<button class="chip" data-p="' + pp[0] + '" data-on="' + (pp[0] === sel ? 1 : 0) + '" style="height:24px;padding:0 10px;font-size:11px;border:1px solid var(--border);border-radius:999px">' + pp[1] + '</button>';
        }).join('') + '</div>' +
        '<div style="display:flex;align-items:baseline;gap:8px;margin-bottom:8px"><span style="font-size:11px;color:var(--fg3)">合计</span>' + chainNum(x.total) + '</div>' +
        parts.map(function (q) {
          var v = q[1] || 0, wpct = Math.round(Math.abs(v) / maxAbs * 100);
          var col = v > 0 ? 'var(--up)' : v < 0 ? 'var(--down)' : 'var(--cap)';
          return '<div style="display:flex;align-items:center;gap:8px;padding:5px 0">' +
            '<span style="width:56px;flex:none;font-size:11.5px">' + q[0] + '</span>' +
            '<span style="flex:1;height:6px;border-radius:3px;background:var(--surface);position:relative;overflow:hidden">' +
