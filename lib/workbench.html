      el.textContent = (v > 0 ? '+' : '') + v.toFixed(digits) + (suffix || '');
      if (k < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
    // 兜底：动画被中断也保证最终值正确
    setTimeout(function () { el.textContent = final; }, 1200);
  }

  /* 上证指数当日分时：真实数据 + 自动刷新 */
  var idxTimer = null;
  function loadIndexIntraday(canvas, code, quotes) {
    var lastData = null;
    function draw(points, preClose) {
      var dpr = window.devicePixelRatio || 1;
      var r = canvas.getBoundingClientRect();
      var w = r.width || 600, h = r.height || 150;
      canvas.width = w * dpr; canvas.height = h * dpr;
      var ctx2 = canvas.getContext('2d');
      ctx2.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx2.clearRect(0, 0, w, h);
      if (!points || !points.length) return;
      var padL = 8, padR = 52, padT = 10, gap = 8, axisH = 14;
      var volH = Math.max(22, (h - padT - gap - axisH) * 0.22);
      var plotW = w - padL - padR, plotH = h - padT - volH - gap - axisH;
      var prices = points.map(function (p) { return p.close; });
      var avgs = points.map(function (p) { return p.avg > 0 ? p.avg : p.close; });
      var hi = Math.max.apply(null, prices), lo = Math.min.apply(null, prices);
      if (preClose) { hi = Math.max(hi, preClose); lo = Math.min(lo, preClose); }
      var span = Math.max(hi - lo, (preClose || hi) * 0.0015);
      hi = Math.max(hi, (preClose || hi)) + span * 0.12;
      lo = Math.min(lo, (preClose || lo)) - span * 0.12;
      var maxVol = Math.max.apply(null, points.map(function (p) { return p.volume || 0; })) || 1;
      function X(i) { return padL + (i / Math.max(1, points.length - 1)) * plotW; }
      function Y(p) { return padT + (hi - p) / (hi - lo) * plotH; }
      function YV(v) { return h - axisH - (v / maxVol) * volH; }
      var up = preClose && prices[prices.length - 1] >= preClose;
      var upCol = getComputedStyle(document.documentElement).getPropertyValue('--up').trim() || '#d93025';
      var downCol = getComputedStyle(document.documentElement).getPropertyValue('--down').trim() || '#188038';
      var lineCol = up ? upCol : downCol;
      // 网格
      ctx2.strokeStyle = '#eee'; ctx2.lineWidth = 1;
      for (var g = 0; g <= 3; g++) {
        var y = padT + plotH * g / 3;
        ctx2.beginPath(); ctx2.moveTo(padL, y); ctx2.lineTo(w - padR, y); ctx2.stroke();
      }
      // 昨收基准
      if (preClose) {
        ctx2.strokeStyle = '#bbb'; ctx2.setLineDash([3, 3]);
        ctx2.beginPath(); ctx2.moveTo(padL, Y(preClose)); ctx2.lineTo(w - padR, Y(preClose)); ctx2.stroke();
        ctx2.setLineDash([]);
      }
      // 量能
      var bw = plotW / Math.max(1, points.length);
      for (var k = 0; k < points.length; k++) {
        var pv = points[k];
        var prev = k > 0 ? points[k - 1].close : (preClose || pv.close);
        ctx2.fillStyle = pv.close >= prev ? upCol : downCol;
        ctx2.globalAlpha = 0.28;
        var yv = YV(pv.volume || 0);
        ctx2.fillRect(X(k), yv, Math.max(1, bw * 0.8), (h - axisH) - yv);
        ctx2.globalAlpha = 1;
      }
      // 均价线
      ctx2.strokeStyle = '#c99a2e'; ctx2.lineWidth = 1.1; ctx2.beginPath();
      for (var a = 0; a < avgs.length; a++) {
        var ax = X(a), ay = Y(avgs[a]);
        if (a === 0) ctx2.moveTo(ax, ay); else ctx2.lineTo(ax, ay);
      }
      ctx2.stroke();
      // 价格线
      ctx2.strokeStyle = lineCol; ctx2.lineWidth = 1.5; ctx2.beginPath();
      for (var i = 0; i < prices.length; i++) {
        var px = X(i), py = Y(prices[i]);
        if (i === 0) ctx2.moveTo(px, py); else ctx2.lineTo(px, py);
      }
      ctx2.stroke();
      // 最新点
      ctx2.fillStyle = lineCol;
      ctx2.beginPath(); ctx2.arc(X(prices.length - 1), Y(prices[prices.length - 1]), 2.6, 0, Math.PI * 2); ctx2.fill();
      // 价格轴
      ctx2.fillStyle = '#999'; ctx2.font = '10px ui-monospace, Menlo, monospace';
      for (var q = 0; q <= 3; q++) {
        var py2 = padT + plotH * q / 3;
        var val = hi - (hi - lo) * q / 3;
        ctx2.fillText(val.toFixed(2), w - padR + 5, py2 + 3);
      }
      // 时间轴
      ctx2.fillStyle = '#aaa';
      var step = Math.max(1, Math.floor(points.length / 4));
      for (var ti = 0; ti < points.length; ti += step) {
        var tm = (points[ti].t || '').split(' ')[1] || '';
        ctx2.fillText(tm.slice(0, 5), X(ti) - 8, h - 3);
      }
    }

    function refresh() {
      if (!pageVisible || !canvas.isConnected) return;
      api('/indexintraday?code=' + encodeURIComponent(code)).then(function (j) {
        if (!j || !j.ok) return;
        if (!canvas.isConnected) return;
        lastData = j;
        draw(j.points, j.pre_close);
        if (quotes && j.points && j.points.length) {
          var last = j.points[j.points.length - 1].close;
          var pct = j.pre_close ? ((last - j.pre_close) / j.pre_close) * 100 : null;
          var cls = pct > 0 ? 'up' : pct < 0 ? 'down' : 'flat';
          quotes.className = cls;
          quotes.innerHTML = '<b style="font-size:12px">' + last.toFixed(2) + '</b> ' + (pct > 0 ? '+' : '') + (pct == null ? '—' : pct.toFixed(2) + '%');
        }
        // 数据在刷新，时间由全局时钟负责走字
      }).catch(function () { if (quotes && !lastData) quotes.textContent = '分时暂不可用'; });
    }
    var observer = new ResizeObserver(function () { if (lastData && canvas.isConnected) draw(lastData.points, lastData.pre_close); });
    observer.observe(canvas);
    refresh();
    return { refresh: refresh, dispose: function () { observer.disconnect(); } };
  }

        }) +

        }) +
        card('今日主力净流入', '今日大单方向', m.inflow.slice(0, 6), function (b) {

  /* 点板块 → 看成分股（复用涨停归因里的板块成员接口） */
  function openSectorPanel(name, code, members) {
    var box = $('right');
    if (!box) return;
    leaveStock();
    box.innerHTML = '<div style="display:flex;align-items:baseline;gap:8px;margin-bottom:10px">' +
      '<b style="font-size:14px">' + name + '</b><span style="font-size:10.5px;color:var(--cap)">' + code + '</span></div>' +
      '<div class="ld-head"><span class="spin"></span><b>正在取成分股</b><span class="ld-step">按今日涨幅排序<span class="ld-dots"></span></span></div>';

      var list = (r && r.ok && r.members) || [];
      if (!list.length) { box.innerHTML = '<div class="empty">该板块成分股暂不可用</div>'; return; }

            '<span style="font-size:10px;color:var(--cap)">' + s.code + '</span>' +
            '<b class="' + (p > 0 ? 'up' : p < 0 ? 'down' : 'flat') + '" style="min-width:56px;text-align:right">' + (p == null ? '—' : (p > 0 ? '+' : '') + p.toFixed(2) + '%') + '</b></div>';
        }).join('');
      Array.prototype.forEach.call(box.querySelectorAll('[data-code]'), function (row) {
        row.addEventListener('click', function () { setView('market'); load(row.getAttribute('data-code')); });

      // 妖股候选

            '<span style="font-size:10px;color:var(--fg3)">' + (c.price != null ? c.price + ' 元' : '') + (c.float_cap ? ' · ' + (c.float_cap / 1e8).toFixed(0) + ' 亿' : '') + '</span>' +
            '<span style="width:26px;text-align:right;font-family:var(--mono);font-size:11px;font-weight:600;color:' + col + '">' + sc + '</span></div>';
        }).join('') + '</div>';
      }

      // 妖股：首页只放潜质榜前三预览，完整内容在左侧「妖股扫描」独立视图
      html += '<div style="padding:10px 13px 4px;border-top:1px solid var(--border-soft);display:flex;align-items:center;gap:8px">' +
        '<span style="font-size:11px;font-weight:600;color:var(--fg2)">妖股潜质 · 前三</span>' +
        '<span style="font-size:10px;color:var(--cap)">按当前强度排序</span>' +
        '<button id="scanBtn" style="margin-left:auto;height:24px;padding:0 10px;border:1px solid var(--border);background:var(--layer);border-radius:999px;cursor:pointer;font-size:10.5px;color:var(--fg2)">查看全部 →</button></div>' +
        '<div id="scanBox" style="padding:0 13px 10px"></div>';

      // 跨年窗口说明
      if (cy.active) {
        html += '<div style="margin:4px 13px 12px;padding:9px 11px;border:1px solid var(--border-soft);border-radius:var(--r-s);background:var(--surface2)">' +
          '<div style="font-size:10.5px;font-weight:600;color:var(--fg2);margin-bottom:4px">跨年窗口 · 怎么理解</div>' +
          (cy.rules || []).map(function (r) { return '<div style="font-size:10px;color:var(--cap);line-height:1.6">· ' + r + '</div>'; }).join('') +

      Array.prototype.forEach.call(host.querySelectorAll('.clickable[data-code]'), function (row) {
        row.addEventListener('click', function () { setView('market'); load(row.getAttribute('data-code')); });
      });
    }).catch(function () {
      host.innerHTML = '<div style="padding:12px 13px;color:var(--cap);font-size:11px">梯队数据不可用</div>';
    });
  }

  /* 首页只放潜质榜前三，完整榜单在独立视图 */

    if (!box) return;

      if (!top.length) { box.innerHTML = '<div style="color:var(--cap);font-size:10.5px">暂无可展示标的</div>'; return; }

        var sc = x.potential ? x.potential.score : 0;

        var col = sc >= 75 ? 'var(--up)' : sc >= 55 ? 'var(--warn)' : 'var(--fg3)';
        return '<div class="clickable" data-code="' + x.code + '" style="display:flex;align-items:baseline;gap:8px;' +
          'padding:6px 8px;margin:0 -8px;border-bottom:1px solid var(--border-soft)">' +
          '<span style="color:var(--cap);font-family:var(--mono);font-size:10px;width:12px">' + (i + 1) + '</span>' +

          '<span style="font-size:10px;color:var(--fg3)">' +
            (rs.excess_20d != null ? '超额' + (rs.excess_20d > 0 ? '+' : '') + rs.excess_20d + 'pp' : '') +
            (x.features.price != null ? ' · ' + x.features.price + '元' : '') + '</span>' +
          '<span style="margin-left:auto;font-family:var(--mono);font-size:12px;font-weight:700;color:' + col + '">' + sc + '</span>' +

      Array.prototype.forEach.call(box.querySelectorAll('[data-code]'), function (row) {

  var monsterScanCache = null;
  function renderMonsterScan(box, force) {
    if (!box) return;
    if (monsterScanCache && !force) { paintMonsterScan(box, monsterScanCache); return; }
    box.innerHTML = '<div style="color:var(--cap);font-size:10.5px;line-height:1.7">' +
      '<span class="spin" style="margin-right:6px"></span>正在扫描全市场（约 260 只取样，首次约 4 秒）…</div>';
    api('/monsters').then(function (r) {
      if (!r || !r.ok) { box.innerHTML = '<div style="color:var(--cap);font-size:10.5px">扫描失败：' + ((r && r.error) || '未知错误') + '</div>'; return; }
      monsterScanCache = r;
      paintMonsterScan(box, r);
    }).catch(function (e) {
      box.innerHTML = '<div style="color:var(--cap);font-size:10.5px">扫描失败：' + (e && e.message ? e.message : e) + '</div>';
    });
  }

  function paintMonsterScan(box, r) {
    var ORDER = ['ambush', 'launch', 'wave1', 'wave2', 'climax'];
    var stage = window.__monsterStage || 'launch';
    box.innerHTML = '';
    // 阶段页签
    var tabs = document.createElement('div');
    tabs.style.cssText = 'display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px';
    ORDER.forEach(function (k) {
      var st = r.stages && r.stages[k];
      if (!st) return;
      var b = document.createElement('button');
      b.className = 'chip';
      b.style.cssText = 'height:24px;padding:0 10px;font-size:10.5px;border:1px solid var(--border);background:transparent;border-radius:999px;color:var(--fg2)';
      if (k === stage) b.setAttribute('data-on', '1');
      b.textContent = st.name + ' ' + (st.items ? st.items.length : 0);
      b.addEventListener('click', function () { window.__monsterStage = k; paintMonsterScan(box, r); });
      tabs.appendChild(b);
    });
    box.appendChild(tabs);

    var cur = r.stages && r.stages[stage];
    if (!cur || !cur.items || !cur.items.length) {
      var empty = document.createElement('div');
      empty.style.cssText = 'font-size:10.5px;color:var(--cap)';
      empty.textContent = '当前阶段没有符合条件的标的';
      box.appendChild(empty);
      return;
    }
    var meta = document.createElement('div');
    meta.style.cssText = 'font-size:10px;color:var(--cap);line-height:1.6;margin-bottom:6px';
    meta.textContent = '性质：' + cur.mean + '　｜　该做什么：' + cur.action;
    box.appendChild(meta);

    cur.items.forEach(function (it) {
      var f = it.features || {};
      var row = document.createElement('div');
      row.className = 'clickable';
      row.setAttribute('data-code', it.code);
      row.style.cssText = 'padding:8px;margin:0 -8px;border-bottom:1px solid var(--border-soft)';
      var col = it.score >= 75 ? 'var(--up)' : it.score >= 55 ? 'var(--warn)' : 'var(--fg3)';
      var line1 = '<div style="display:flex;align-items:baseline;gap:8px">' +
        '<span style="font-size:11.5px;font-weight:600">' + it.name + '</span>' +
        '<span style="font-family:var(--mono);font-size:10px;color:var(--cap)">' + it.code + '</span>' +
        '<span style="font-size:10px;color:var(--fg3)">' + (f.price != null ? f.price + ' 元' : '') +
        (f.float_cap_yi != null ? ' · ' + f.float_cap_yi + ' 亿' : '') +
        (f.ret60 != null ? ' · 60日 ' + f.ret60 + '%' : '') +
        (f.pos120 != null ? ' · 位置 ' + f.pos120 + '%' : '') + '</span>' +
        '<span style="margin-left:auto;font-family:var(--mono);font-size:11.5px;font-weight:600;color:' + col + '">' + it.score + '</span></div>';
      // 资金 / 龙虎榜摘要
      var fd = it.fund, bb = it.billboard;
      var yi = function (v) { return (v / 1e8).toFixed(2) + ' 亿'; };
      var fundLine = '';
      if (fd) {
        var c5 = fd.main_5d >= 0 ? 'up' : 'down';
        var c20 = fd.main_20d >= 0 ? 'up' : 'down';
        fundLine = '<div style="font-size:10px;color:var(--fg3);line-height:1.5;margin-top:2px">' +
          '主力 <span class="' + c5 + '">5日 ' + (fd.main_5d >= 0 ? '+' : '') + yi(fd.main_5d) + '</span>' +
          '　<span class="' + c20 + '">20日 ' + (fd.main_20d >= 0 ? '+' : '') + yi(fd.main_20d) + '</span>' +
          (fd.inflow_streak >= 2 ? '　连续 ' + fd.inflow_streak + ' 日流入' : '') +
          (fd.outflow_streak >= 2 ? '　连续 ' + fd.outflow_streak + ' 日流出' : '') + '</div>';
      }
      var bbLine = '';
      if (bb && bb.days > 0) {
        bbLine = '<div style="font-size:10px;color:var(--fg3);line-height:1.5">龙虎榜 近30日 ' + bb.days + ' 次' +
          (bb.famous && bb.famous.length ? '　<span style="color:var(--warn)">疑似游资：' + bb.famous[0] + '</span>' : '') +
          (bb.institution ? '　机构 ' + bb.institution + ' 席' : '') +
          (bb.net ? '　净' + (bb.net >= 0 ? '买' : '卖') + (Math.abs(bb.net) / 1e8).toFixed(2) + '亿' : '') + '</div>';
      }
      // 概念 / 筹码 / 杠杆 / 解禁 / 涨停基因
      var pf = it.profile || {};
      var profLine = '';
      if (pf && (pf.concept_count || pf.holder_change_pct != null || pf.margin_change_pct != null)) {
        var bits = [];
        if (pf.concept_count) bits.push('概念 ' + pf.concept_count);
        if (pf.hot_concepts && pf.hot_concepts.length) bits.push('<span style="color:var(--warn)">' + pf.hot_concepts.slice(0, 3).join('、') + '</span>');
        if (pf.holder_change_pct != null) {
          var hc = pf.holder_change_pct <= 0 ? 'up' : 'down';
          bits.push('户数 <span class="' + hc + '">' + (pf.holder_change_pct > 0 ? '+' : '') + pf.holder_change_pct + '%</span>');
        }
        if (pf.margin_change_pct != null) {
          var mc = pf.margin_change_pct >= 0 ? 'up' : 'down';
          bits.push('融资 <span class="' + mc + '">' + (pf.margin_change_pct > 0 ? '+' : '') + pf.margin_change_pct + '%</span>');
        }
        if (pf.unlock_90d_count) bits.push('90日解禁 ' + pf.unlock_90d_count + ' 批');
        profLine = '<div style="font-size:10px;color:var(--fg3);line-height:1.5">' + bits.join('　') + '</div>';
      }
      var geneLine = '';
      if (f.limit_ups_90d) {
        geneLine = '<div style="font-size:10px;color:var(--fg3);line-height:1.5">涨停基因 近90日 ' + f.limit_ups_90d + ' 次' +
          (f.max_consecutive_90d >= 2 ? '，最大 ' + f.max_consecutive_90d + ' 连板' : '') + '</div>';
      }
      var line2 = (it.reasons || []).slice(0, 2).map(function (x) {
        return '<div style="font-size:10px;color:var(--fg3);line-height:1.5">· ' + x + '</div>';
      }).join('');
      var line3 = (it.risks || []).slice(0, 1).map(function (x) {
        return '<div style="font-size:10px;color:var(--warn);line-height:1.5;margin-top:2px">! ' + x + '</div>';
      }).join('');
      row.innerHTML = line1 + fundLine + bbLine + profLine + geneLine + line2 + line3;
      row.addEventListener('click', function () { setView('market'); load(it.code); });
      box.appendChild(row);
    });

    var note = document.createElement('div');
    note.className = 'caveat';
    note.style.marginTop = '6px';
    note.textContent = '题材是涨起来之后才有的叙事，不参与事前筛选；阶段判断是形态识别，不是预测';
    box.appendChild(note);
  }

  /* ── 妖股独立视图 ── */

      '<div class="boot-line" style="width:180px;height:16px"></div>' +

      '<div class="boot-line" style="width:82%"></div>' +
      '<div class="boot-line" style="width:70%"></div>' +
      '<div class="boot-line" style="width:48%"></div></div>';
    api('/monsters').then(function (r) {
      if (!r || !r.ok) { v.innerHTML = '<div class="empty">妖股扫描失败：' + ((r && r.error) || '未知错误') + '</div>'; return; }
      monsterViewState = r;
      paintMonsterView(v, r);
    }).catch(function (e) {
      v.innerHTML = '<div class="empty">妖股扫描失败：' + (e && e.message ? e.message : e) + '</div>';

  function paintMonsterView(v, r) {

      '<div><div style="font-size:16px;font-weight:650">妖股扫描</div>' +
      '<div style="font-size:10.5px;color:var(--cap);margin-top:3px">全市场 ' + (r.universe || 0) + ' 只中取样 ' + (r.scanned || 0) + ' 只 · ' + W + '</div></div>' +
      '<div style="margin-left:auto;font-size:10px;color:var(--cap)">妖股潜质 = 当前强度；跨年妖 = 日历窗口 + 历史五特征，两者不是一回事</div></div>';
    var tabs = '<div style="display:flex;gap:8px;padding:12px 26px 0">' +
      [['potential', '妖股潜质榜'], ['crossyear', '跨年妖候选'], ['stages', '阶段扫描']].map(function (t) {

        return '<button class="chip" data-tab="' + t[0] + '" data-on="' + (on ? 1 : 0) + '" ' +
          'style="height:27px;padding:0 13px;font-size:11px;border:1px solid ' + (on ? 'var(--fg)' : 'var(--border)') + ';' +
          'border-radius:999px;cursor:pointer;background:' + (on ? 'var(--fg)' : 'transparent') + ';color:' + (on ? 'var(--layer)' : 'var(--fg2)') + '">' + t[1] + '</button>';
      }).join('') + '</div>';

    ldStepTimer = setInterval(function () {
      var el = $('ldStep');

      k = Math.min(k + 1, steps.length - 1);
      el.style.opacity = '0';
      setTimeout(function () { el.textContent = steps[k] + '…'; el.style.opacity = '1'; }, 180);

  function progress(v) {
    var bar = $('progress');
    if (!bar) return;
    if (v === 0) { bar.style.opacity = '0'; bar.style.width = '0%'; return; }
    bar.style.opacity = '1';
    bar.style.width = v + '%';
    if (v >= 100) setTimeout(function () { bar.style.opacity = '0'; bar.style.width = '0%'; }, 320);
  }

  function load(symbol, force) {
    var my = ++navSeq;
    clearStockActions();
    currentView = 'stock';
    markNav('stock');
    if ($('crumb')) $('crumb').style.display = 'block';
    if ($('monsterView')) $('monsterView').style.display = 'none';
    if ($('portfolioView')) $('portfolioView').style.display = 'none';
    if ($('ladderView')) $('ladderView').style.display = 'none';
    hideIdleCenter();
    stopMinTimer();
    var qEl = $('quote'); if (qEl) qEl.style.display = '';
    var qmEl = $('qmeta'); if (qmEl) qmEl.style.display = '';
    state.symbol = symbol;
    try { localStorage.setItem(LS_LAST, symbol); } catch (e) {}
    var nm = knownName(symbol);
    setProgress(true);
    rightSkeleton(nm);
    quoteSkeleton(symbol, nm);
    chartSkeleton(true, nm);
    progress(18);
    Promise.all([
      api('/card?symbol=' + encodeURIComponent(symbol) + (force ? '&refresh=1' : '') + (function () {
        var myPos = getPosition(symbol);
        return myPos ? '&cost=' + myPos.cost + '&qty=' + myPos.qty : '';
      })()),
      loadDayData(),
      state.mode === 'min' ? loadMinData() : Promise.resolve(null)
    ]).then(function (res) {
      // 期间用户已切到别的股票或页面：这份结果作废
      if (my !== navSeq || state.symbol !== symbol) return;
      chartSkeleton(false);
      resize();
      progress(88);
      var p = res[0];
      if (!p || !p.ok) { rightEmpty('取数失败：' + ((p && p.error) || '未知错误')); return; }
      clearInterval(ldStepTimer);
      state.card = p;
      renderQuote(p);
      renderRight(p);
      renderStockActions(p);
      reveal($('right'));
      reveal($('quote'));
      reveal($('qmeta'));
      var cvEl = $('cv'); if (cvEl) { cvEl.classList.remove('reveal-cv'); void cvEl.offsetWidth; cvEl.classList.add('reveal-cv'); }
      progress(100);
      var ft = $('footTime');
      if (ft) ft.textContent = '数据时点 ' + (p.trade_date || '—');
      setProgress(false);
      if (p.name && !watch.some(function (x) { return x.code === symbol; })) {
        watch.unshift({ code: symbol, name: p.name });
        saveWatch(watch);
      }
      renderWatch();
    }).catch(function (e) {
      if (my !== navSeq) return;
      clearInterval(ldStepTimer);
      rightEmpty('请求失败：' + (e && e.message ? e.message : e));
      chartSkeleton(false);
      setProgress(false);
    });
  }

      return j;

  }
  function loadMinData() {
    return Promise.all([
      api('/minutes?symbol=' + encodeURIComponent(state.symbol) + '&days=1').catch(function () { return null; }),
      api('/flowintraday?symbol=' + encodeURIComponent(state.symbol)).catch(function () { return null; }),
    ]).then(function (res) {
      var j = res[0], f = res[1];
      state.minutes = (j && j.ok) ? j.points : [];
      state.preClose = (j && j.ok) ? j.preClose : null;
      state.flow = (f && f.ok) ? f.flow : [];
      return j;
    });
  }
  var minTimer = null;
  /* 全局实时时钟：所有 .live-clock 元素每秒显示当前时间 */
  setInterval(function () {
    var now = new Date().toLocaleTimeString('zh-CN', { hour12: false });
    var els = document.querySelectorAll('.live-clock');
    for (var i = 0; i < els.length; i++) els[i].textContent = now;
  }, 1000);

  function isTradingNow() {
    var d = new Date(); var wd = d.getDay();
    if (wd === 0 || wd === 6) return false;
    var hm = d.getHours() * 100 + d.getMinutes();
    return (hm >= 925 && hm <= 1130) || (hm >= 1300 && hm <= 1500);
  }
  function stopMinTimer() { if (minTimer) { clearInterval(minTimer); minTimer = null; } }
  function startMinTimer() {
    stopMinTimer();
    if (state.mode !== 'min' || !state.symbol) return;
    minTimer = setInterval(function () {
      if (!isTradingNow() || state.mode !== 'min' || !state.symbol) return;
      Promise.all([
        api('/minutes?symbol=' + encodeURIComponent(state.symbol) + '&days=1').catch(function () { return null; }),
        api('/flowintraday?symbol=' + encodeURIComponent(state.symbol)).catch(function () { return null; }),
      ]).then(function (res) {
        var j = res[0], f = res[1];
        if (j && j.ok) { state.minutes = j.points || []; state.preClose = j.preClose; state.lastMinAt = Date.now(); }
        if (f && f.ok) state.flow = f.flow || [];
        draw();
      }).catch(function () {});
    }, 5000);
  }

  function loadChart() {
    chartSkeleton(true);
    if (state.mode === 'min') {
      return api('/minutes?symbol=' + encodeURIComponent(state.symbol) + '&days=1').then(function (j) {
        state.minutes = (j && j.ok) ? j.points : [];
        state.preClose = (j && j.ok) ? j.preClose : null;
        if (j && j.ok) state.lastMinAt = Date.now();
        resize();
        chartSkeleton(false);
        startMinTimer();
        return j;
      }).catch(function (e) { chartSkeleton(false); throw e; });
    }
    return api('/kline?symbol=' + encodeURIComponent(state.symbol) + '&lmt=' + state.lmt).then(function (j) {
      state.bars = (j && j.ok) ? j.bars : [];
      resize();
      chartSkeleton(false);
      return j;
    }).catch(function (e) { chartSkeleton(false); throw e; });
  }
  // 分时 30 秒自动刷新（仅交易时段粗略判断：工作日）
  setInterval(function () {
    if (state.mode !== 'min' || !state.symbol) return;
    var d = new Date();
    var wd = d.getDay();

  /* ── AI 深度解读：SSE 流式 ── */
  function mdLite(text) {
    // Parse blocks before formatting: replacing every newline after adding <div>
    // used to produce extra <br>s around lists and headings.
    var esc = function (v) { return String(v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); };
    var inline = function (v) { return esc(v).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>'); };
    var lines = String(text || '').replace(/\r\n?/g, '\n').split('\n');
    var out = [], paragraph = [], listType = null;
    function closeList() { if (listType) { out.push('</' + listType + '>'); listType = null; } }
    function flush() { if (paragraph.length) { out.push('<p>' + inline(paragraph.join(' ')) + '</p>'); paragraph = []; } }
    lines.forEach(function (raw) {
      var line = raw.trim();
      if (!line) { flush(); return; }
      var heading = line.match(/^#{1,6}\s+(.+)$/);
      var plainHeading = /^(三条核心理由|三条主要风险|分周期判断|操作建议(?:（[^）]*）)?|失效条件|无数据说明|结论)$/.test(line);
      if (heading || plainHeading) {
        flush(); closeList();
        var title = heading ? heading[1] : line;
        var tone = /风险|无数据/.test(title) ? ' ai-muted' : '';
        out.push('<h3 class="ai-section' + tone + '">' + inline(title) + '</h3>');
        return;
      }
      var ordered = line.match(/^\d+[.、)]\s*(.+)$/);
      var bullet = line.match(/^(?:[-*·•])\s+(.+)$/);
      if (ordered || bullet) {
        flush();
        var type = ordered ? 'ol' : 'ul';
        if (listType !== type) { closeList(); out.push('<' + type + '>'); listType = type; }
        out.push('<li>' + inline((ordered || bullet)[1]) + '</li>');
        return;
      }
      closeList(); paragraph.push(line);
    });
    flush(); closeList();
    return out.join('');
  }

  async function runAI(symbol, box, btn) {
    box.classList.add('ai-report');
    box.style.color = '';
    btn.disabled = true;
    btn.innerHTML = '<span class="spin" style="margin-right:6px"></span>分析中…';
    btn.style.opacity = '.7';
    box.innerHTML = '<span style="color:var(--cap)">正在准备…</span>';
    var acc = '';
    var streamError = '';
    try {
      var myPos = getPosition(symbol);
      var qs = myPos ? '&cost=' + myPos.cost + '&qty=' + myPos.qty : '';
      var res = await fetch(API + '/analyze?symbol=' + encodeURIComponent(symbol) + qs);
      if (!res.ok || !res.body) throw new Error('HTTP ' + res.status);
      var reader = res.body.getReader();
      var dec = new TextDecoder();
      var buf = '';
      for (;;) {
        var chunk = await reader.read();
        if (chunk.done) break;
        buf += dec.decode(chunk.value, { stream: true });
        var idx;
        while ((idx = buf.indexOf('\n\n')) >= 0) {
          var raw = buf.slice(0, idx);
          buf = buf.slice(idx + 2);
          if (raw.indexOf('data: ') !== 0) continue;
          var msg;
          try { msg = JSON.parse(raw.slice(6)); } catch (e) { continue; }
          if (msg.type === 'status') {
            box.innerHTML = '<span class="spin" style="margin-right:6px"></span><span style="color:var(--fg3)">' + msg.text + '</span>';
          } else if (msg.type === 'delta') {
            acc += msg.text;
            box.innerHTML = mdLite(acc) + '<span style="opacity:.45">▍</span>';
          } else if (msg.type === 'error' || (msg.type === 'finish' && msg.reason && msg.reason.kind === 'error')) {
            var failure = msg.reason && (msg.reason.failure || msg.reason);
            streamError = msg.error || (failure && failure.message) || '模型调用失败';
            box.textContent = '分析失败：' + streamError;
            box.style.color = 'var(--warn)';
          } else if (msg.type === 'done') {
            if (acc) box.innerHTML = mdLite(acc);
          }
        }
      }
      if (acc) box.innerHTML = mdLite(acc);
      else if (!streamError) box.textContent = '模型连接已结束，但未返回分析正文。请点击重新生成；若持续失败，请检查当前模型服务状态。';
    } catch (e) {
      box.innerHTML = '<span style="color:var(--up)">请求失败：' + (e && e.message ? e.message : e) + '</span>';
    } finally {
      btn.disabled = false;
      btn.textContent = '重新生成';
      btn.style.opacity = '1';
    }
  }

      /* 复盘归因：FIFO 配对，算出每笔卖出对应的买入成本与真实盈亏 */
  function fifoMatch() {
    var trades = getTrades().slice().sort(function (a, b) { return a.at - b.at; });
    var lots = {};
    var matched = [];
    trades.forEach(function (t) {
      if (t.side === 'buy') {
        if (!lots[t.symbol]) lots[t.symbol] = [];
        lots[t.symbol].push({ qty: t.qty, price: t.price, at: t.at });
      } else {
        var remain = t.qty;
        var q = lots[t.symbol] || [];
        while (remain > 0 && q.length) {
          var lot = q[0];
          var take = Math.min(remain, lot.qty);
          matched.push({
            symbol: t.symbol, name: t.name || t.symbol,
            buy_at: lot.at, sell_at: t.at, qty: take,
            buy: lot.price, sell: t.price,
            pnl: (t.price - lot.price) * take,
            pnl_pct: lot.price ? ((t.price - lot.price) / lot.price) * 100 : 0,
            hold_days: Math.max(0, Math.round((t.at - lot.at) / 86400000)),
          });
          lot.qty -= take; remain -= take;
          if (lot.qty <= 0) q.shift();
        }
        lots[t.symbol] = q;
      }
    });
    return matched;
  }

  function reviewStats() {
    var m = fifoMatch();
    var closed = m.slice();
    var total = closed.length;
    var wins = closed.filter(function (x) { return x.pnl > 0; });
    var losses = closed.filter(function (x) { return x.pnl <= 0; });
    var sumWin = wins.reduce(function (a, x) { return a + x.pnl; }, 0);
    var sumLoss = losses.reduce(function (a, x) { return a + x.pnl; }, 0);
    var avgHold = total ? closed.reduce(function (a, x) { return a + x.hold_days; }, 0) / total : 0;
    return {
      closed: closed,
      total: total,
      win_count: wins.length,
      lose_count: losses.length,
      win_rate: total ? (wins.length / total) * 100 : null,
      total_pnl: closed.reduce(function (a, x) { return a + x.pnl; }, 0),
      avg_win: wins.length ? sumWin / wins.length : null,
      avg_loss: losses.length ? sumLoss / losses.length : null,
      profit_factor: sumLoss !== 0 ? Math.abs(sumWin / sumLoss) : null,
      avg_hold: avgHold,
      best: closed.length ? closed.reduce(function (a, x) { return (a.pnl > x.pnl ? a : x); }) : null,
      worst: closed.length ? closed.reduce(function (a, x) { return (a.pnl < x.pnl ? a : x); }) : null,
    };
  }

            '<td style="padding:8px 10px;color:var(--fg3)">' + (pl.horizon || '—') + '</td>' +
            '<td style="text-align:right;padding:8px 10px;font-family:var(--mono)">' + (pl.entry == null ? '—' : pl.entry) + '</td>' +
            '<td style="text-align:right;padding:8px 10px;font-family:var(--mono);color:var(--down)">' + (pl.stop == null ? '—' : pl.stop) + '</td>' +
            '<td style="text-align:right;padding:8px 10px;font-family:var(--mono);color:var(--up)">' + (pl.target == null ? '—' : pl.target) + '</td>' +
            '<td style="text-align:right;padding:8px 10px;font-family:var(--mono)">' + (pl.rr == null ? '—' : pl.rr) + '</td>' +
            '<td style="text-align:center;padding:8px 10px"><span style="font-size:10.5px;padding:2px 6px;border:1px solid var(--border);border-radius:4px;color:' + (pl.status === 'active' ? 'var(--fg2)' : 'var(--cap)') + '">' + (pl.status === 'active' ? '进行中' : pl.status === 'done' ? '已完成' : '已取消') + '</span></td>' +
            '<td style="text-align:right;padding:8px 10px;white-space:nowrap">' +
            (pl.status === 'active' ? '<a href="#" data-plan-done="' + pl.id + '" style="color:var(--accent);text-decoration:none">完成</a> · <a href="#" data-plan-cancel="' + pl.id + '" style="color:var(--fg3);text-decoration:none">取消</a>' : '<a href="#" data-plan-del="' + pl.id + '" style="color:var(--fg3);text-decoration:none">删除</a>') +
            '</td></tr>';
        });
        html += '</table>';
      }

      /* 交易流水 */

      html += '<div style="font-size:11.5px;font-weight:600;margin:18px 0 6px">交易流水 <span style="color:var(--cap);font-weight:400">最近 ' + trades.length + ' 笔</span></div>';
      if (!trades.length) {
        html += '<div style="border:1px solid var(--border-soft);border-radius:var(--r-m);padding:18px;color:var(--cap);font-size:11.5px">还没有交易记录。持仓表里点「记一笔」。</div>';
      } else {
        html += '<table style="width:100%;border-collapse:collapse;font-size:11.5px;border:1px solid var(--border-soft);border-radius:var(--r-m);overflow:hidden">';
        trades.forEach(function (t, tradeIndex) {
          var sideCls = t.side === 'buy' ? 'up' : 'down';
          html += '<tr style="border-top:1px solid var(--border-soft)">' +
            '<td style="padding:7px 10px;color:var(--cap);font-family:var(--mono);font-size:10.5px">' + new Date(t.at).toLocaleString('zh-CN', { hour12: false }) + '</td>' +
            '<td style="padding:7px 10px">' + (t.name || t.symbol) + '</td>' +
            '<td style="padding:7px 10px" class="' + sideCls + '">' + (t.side === 'buy' ? '买入' : '卖出') + '</td>' +
            '<td style="text-align:right;padding:7px 10px;font-family:var(--mono)">' + t.price + ' × ' + t.qty + '</td>' +
            '<td style="text-align:right;padding:7px 10px;font-family:var(--mono)">' + (t.price * t.qty).toFixed(0) + ' 元</td><td><button data-void-trade="' + tradeIndex + '" style="font-size:11px;color:var(--warn);background:transparent;border:0;cursor:pointer">撤销错误记录</button></td></tr>';
        });
        html += '</table>';
      }

      /* 复盘归因 */
      var rv = reviewStats();
      html += '<div style="font-size:11.5px;font-weight:600;margin:18px 0 6px">复盘归因 <span style="color:var(--cap);font-weight:400">已了结 ' + rv.total + ' 笔</span></div>';
      if (!rv.total) {
        html += '<div style="border:1px solid var(--border-soft);border-radius:var(--r-m);padding:18px;color:var(--cap);font-size:11.5px">' +
          '还没有完整的买卖配对。记录买入和卖出后，这里会自动算每笔的真实盈亏、胜率与盈亏比。</div>';
      } else {
        html += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:1px;background:var(--border-soft);border:1px solid var(--border-soft);border-radius:var(--r-m);overflow:hidden;margin-bottom:8px">';
        function rc(label, val, color) {
          return '<div style="background:var(--layer);padding:10px 12px"><div style="font-size:10px;color:var(--cap)">' + label + '</div>' +
            '<div style="font-size:14px;font-weight:650;font-family:var(--mono);margin-top:2px;color:' + (color || 'var(--fg)') + '">' + val + '</div></div>';
        }
        html += rc('胜率', rv.win_rate.toFixed(0) + '%', rv.win_rate >= 50 ? 'var(--up)' : 'var(--warn)');
        html += rc('已实现盈亏', (rv.total_pnl >= 0 ? '+' : '') + rv.total_pnl.toFixed(0), rv.total_pnl >= 0 ? 'var(--up)' : 'var(--down)');
        html += rc('盈亏比', rv.profit_factor == null ? '—' : rv.profit_factor.toFixed(2), rv.profit_factor >= 1.5 ? 'var(--up)' : 'var(--fg)');
        html += rc('平均持有', rv.avg_hold.toFixed(0) + ' 天');
        html += rc('平均盈利', rv.avg_win == null ? '—' : '+' + rv.avg_win.toFixed(0), 'var(--up)');
        html += rc('平均亏损', rv.avg_loss == null ? '—' : rv.avg_loss.toFixed(0), 'var(--down)');
        html += '</div>';

        html += '<table style="width:100%;border-collapse:collapse;font-size:11.5px;border:1px solid var(--border-soft);border-radius:var(--r-m);overflow:hidden">';
        html += '<tr style="background:var(--surface2);color:var(--fg3);font-size:10.5px">' +
          '<th style="text-align:left;padding:8px 10px;font-weight:500">标的</th>' +
          '<th style="text-align:left;padding:8px 10px;font-weight:500">买入</th>' +
          '<th style="text-align:left;padding:8px 10px;font-weight:500">卖出</th>' +
          '<th style="text-align:right;padding:8px 10px;font-weight:500">持有</th>' +
          '<th style="text-align:right;padding:8px 10px;font-weight:500">收益</th>' +
          '<th style="text-align:right;padding:8px 10px;font-weight:500">收益率</th></tr>';
        rv.closed.slice(0, 30).forEach(function (x) {
          var c3 = x.pnl >= 0 ? 'up' : 'down';
          html += '<tr style="border-top:1px solid var(--border-soft)">' +
            '<td style="padding:7px 10px">' + x.name + '</td>' +
            '<td style="padding:7px 10px;color:var(--fg3);font-family:var(--mono);font-size:10.5px">' + new Date(x.buy_at).toLocaleDateString('zh-CN') + ' @' + x.buy + '</td>' +
            '<td style="padding:7px 10px;color:var(--fg3);font-family:var(--mono);font-size:10.5px">' + new Date(x.sell_at).toLocaleDateString('zh-CN') + ' @' + x.sell + '</td>' +
            '<td style="text-align:right;padding:7px 10px;font-family:var(--mono)">' + x.hold_days + ' 天</td>' +
            '<td style="text-align:right;padding:7px 10px;font-family:var(--mono)" class="' + c3 + '">' + (x.pnl >= 0 ? '+' : '') + x.pnl.toFixed(0) + '</td>' +
            '<td style="text-align:right;padding:7px 10px;font-family:var(--mono)" class="' + c3 + '">' + (x.pnl_pct >= 0 ? '+' : '') + x.pnl_pct.toFixed(2) + '%</td></tr>';
        });
        html += '</table>';
        if (rv.best && rv.worst) {
          html += '<div style="margin-top:8px;font-size:10.5px;color:var(--cap);line-height:1.6">' +
            '最好一笔：' + rv.best.name + ' +' + rv.best.pnl.toFixed(0) + ' 元（' + rv.best.pnl_pct.toFixed(1) + '%）　' +
            '最差一笔：' + rv.worst.name + ' ' + rv.worst.pnl.toFixed(0) + ' 元（' + rv.worst.pnl_pct.toFixed(1) + '%）</div>';
        }
      }

      html += '<div style="margin-top:16px;font-size:10.5px;color:var(--cap)">交易记录保存在本机浏览器；点击AI分析会向你配置的模型服务发送行情和持仓成本等分析上下文。</div>';
      html += '</div>';
      pv.innerHTML = html;

      pv.querySelectorAll('[data-void-trade]').forEach(function (b) {
        b.addEventListener('click', function () {
          var all = getTrades(), index = Number(b.dataset.voidTrade), t = all[index];
          if (!t || !confirm('撤销这笔错误记录？会先备份并从复盘中排除。不会盲目反加股数；请随后按实际余额核对持仓。')) return;
          try {
            localStorage.setItem('tianshi.tradeBackup.' + Date.now(), JSON.stringify({ trades: all, positions: storeGet('positions', {}) }));
            all.splice(index, 1); localStorage.setItem('tianshi.trades', JSON.stringify(all));
            toast('错误流水已撤销并备份，请核对实际持仓'); renderPortfolio();
          } catch (e) { toast('备份或撤销失败，未继续操作'); }
        });
      });
      pv.querySelectorAll('[data-open]').forEach(function (a) {
        a.addEventListener('click', function (e) { e.preventDefault(); setView('market'); load(a.getAttribute('data-open')); });
      });
      pv.querySelectorAll('[data-trade]').forEach(function (a) {
        a.addEventListener('click', function (e) { e.preventDefault(); openTradeDialog(a.getAttribute('data-trade')); });
      });
      pv.querySelectorAll('[data-plan-done]').forEach(function (a) {
        a.addEventListener('click', function (e) { e.preventDefault(); updatePlan(a.getAttribute('data-plan-done'), { status: 'done' }); renderPortfolio(); });
      });
      pv.querySelectorAll('[data-plan-cancel]').forEach(function (a) {
        a.addEventListener('click', function (e) { e.preventDefault(); updatePlan(a.getAttribute('data-plan-cancel'), { status: 'cancel' }); renderPortfolio(); });
      });
      pv.querySelectorAll('[data-plan-del]').forEach(function (a) {
        a.addEventListener('click', function (e) { e.preventDefault(); removePlan(a.getAttribute('data-plan-del')); renderPortfolio(); });
      });
    });
  }

  /* 记账弹窗 */
  function openTradeDialog(symbol) {
    var pos = getPosition(symbol);
    var wrap = document.createElement('div');
    wrap.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:9999;display:flex;align-items:center;justify-content:center';
    var card = document.createElement('div');
    card.style.cssText = 'background:var(--layer);border:1px solid var(--border);border-radius:var(--r-l);padding:18px 20px;width:320px;box-shadow:var(--shadow-l)';
    card.innerHTML = '<div style="font-size:13px;font-weight:600;margin-bottom:10px">记录交易 · ' + symbol + '</div>' +
      '<div style="display:flex;gap:6px;margin-bottom:8px">' +
      '<button id="tBuy" style="flex:1;height:28px;border:1px solid rgba(232,180,76,.9);background:linear-gradient(180deg,rgba(232,180,76,.95),rgba(214,158,44,.95));color:#0A1020;cursor:pointer;border-radius:var(--r-s);font-size:11.5px;font-weight:650">买入</button>' +
      '<button id="tSell" style="flex:1;height:28px;border:1px solid var(--border);background:transparent;cursor:pointer;border-radius:var(--r-s);font-size:11.5px;color:var(--fg2)">卖出</button></div>' +
      '<input id="tPrice" placeholder="成交价" value="' + (pos ? pos.cost : '') + '" style="width:100%;height:30px;border:1px solid var(--border);background:var(--layer);padding:0 9px;font-size:12px;border-radius:var(--r-s);margin-bottom:8px">' +
      '<input id="tQty" placeholder="股数" value="100" style="width:100%;height:30px;border:1px solid var(--border);background:var(--layer);padding:0 9px;font-size:12px;border-radius:var(--r-s);margin-bottom:12px">' +
      '<div style="display:flex;gap:8px">' +
      '<button id="tCancel" style="flex:1;height:30px;border:1px solid var(--border);background:transparent;cursor:pointer;border-radius:var(--r-s);font-size:12px;color:var(--fg3)">取消</button>' +
      '<button id="tSave" style="flex:1;height:30px;border:0;background:linear-gradient(180deg,rgba(232,180,76,.95),rgba(214,158,44,.95));color:#0A1020;cursor:pointer;border-radius:var(--r-s);font-size:12px;font-weight:650">保存</button></div>';
    var info = document.createElement('div'); info.id = 'tHolding'; info.style.cssText = 'font-size:12px;color:var(--fg2);margin-bottom:8px';
    card.insertBefore(info, card.querySelector('#tPrice'));
    var shortcuts = document.createElement('div'); shortcuts.id = 'tFractions'; shortcuts.style.cssText = 'display:none;gap:6px;margin-bottom:10px';
    shortcuts.innerHTML = '<button type="button" data-fraction="0.25">1/4仓</button><button type="button" data-fraction="0.5">半仓</button><button type="button" data-fraction="1">全部卖出</button>';
    var note = document.createElement('p'); note.style.cssText = 'font-size:11px;color:var(--fg3);line-height:1.5;margin:0 0 10px';
    note.textContent = '仅记录实际成交。买入不以现有持仓作上限；卖出不得超过记录持仓。券商可卖数量、T+1限制请另行核对。';
    var err = document.createElement('div'); err.id = 'tTradeError'; err.setAttribute('role', 'alert'); err.style.cssText = 'color:var(--up);font-size:12px;margin-bottom:8px';
    var footer = card.querySelector('#tCancel').parentElement;
    card.insertBefore(shortcuts, footer); card.insertBefore(note, footer); card.insertBefore(err, footer);
    var qtyInput = card.querySelector('#tQty'); qtyInput.type = 'number'; qtyInput.min = '1'; qtyInput.step = '1';
    wrap.appendChild(card);
    document.body.appendChild(wrap);
    var side = 'buy';
    card.querySelector('#tBuy').addEventListener('click', function () {
      side = 'buy';
      card.querySelector('#tBuy').style.background = '#111'; card.querySelector('#tBuy').style.color = '#fff';
      card.querySelector('#tSell').style.background = 'transparent'; card.querySelector('#tSell').style.color = 'var(--fg2)';
    });
    card.querySelector('#tSell').addEventListener('click', function () {
      side = 'sell';
      card.querySelector('#tSell').style.background = '#111'; card.querySelector('#tSell').style.color = '#fff';
      card.querySelector('#tBuy').style.background = 'transparent'; card.querySelector('#tBuy').style.color = 'var(--fg2)';
    });
    function updateTradeLimit() {
      var current = getPosition(symbol), held = current ? current.qty : 0;
      info.textContent = '当前记录持仓：' + held + ' 股' + (side === 'sell' ? ' · 最多卖出 ' + held + ' 股' : '');
      if (side === 'sell') qtyInput.max = held; else qtyInput.removeAttribute('max');
      shortcuts.style.display = side === 'sell' ? 'flex' : 'none'; err.textContent = '';
      card.querySelector('#tSave').disabled = side === 'sell' && held <= 0;
    }
    card.querySelector('#tBuy').addEventListener('click', updateTradeLimit);
    card.querySelector('#tSell').addEventListener('click', updateTradeLimit);
    shortcuts.querySelectorAll('button').forEach(function (b) {
      b.style.cssText = 'flex:1;border:1px solid var(--border);background:var(--surface2);height:27px;color:var(--fg2);cursor:pointer;font-size:11px';
      b.addEventListener('click', function () {
        var current = getPosition(symbol), held = current ? current.qty : 0, fraction = Number(b.dataset.fraction);
        qtyInput.value = fraction === 1 ? held : Math.floor(held * fraction / 100) * 100;
        err.textContent = '';
      });
    });
    updateTradeLimit();
    card.querySelector('#tCancel').addEventListener('click', function () { document.body.removeChild(wrap); });
    card.querySelector('#tSave').addEventListener('click', function () {
      var price = parseFloat(card.querySelector('#tPrice').value);
      var qty = Number(card.querySelector('#tQty').value);
      try {
        addTrade({ symbol: symbol, name: (state.card && state.card.symbol === symbol && state.card.name) || symbol, side: side, price: price, qty: qty, at: Date.now() });
      } catch (e) { err.textContent = e.message; return; }
      document.body.removeChild(wrap);
      toast('已记录' + (side === 'buy' ? '买入' : '卖出'));
      renderPortfolio();
    });
  }

  /* 页面自动更新：工作台在浮层/侧栏里常驻，不会自己重新加载。
     每 30 秒取一次自身文件，与启动时的版本比较，变了就自动刷新到新版本。 */
  (function watchSelfUpdate() {
    var base = null;
    function digest(t) { var h = 0; for (var i = 0; i < t.length; i++) { h = (h * 31 + t.charCodeAt(i)) | 0; } return t.length + ':' + h; }
    function check() {
      if (typeof pageVisible !== 'undefined' && !pageVisible) return;
      fetch(location.pathname, { cache: 'no-store' }).then(function (r) { return r.ok ? r.text() : null; }).then(function (t) {
        if (!t) return;
        var d = digest(t);
        if (base === null) { base = d; return; }
        if (d === base) return;
        // 输入框正在编辑时不打断，下次再检查
        var a = document.activeElement;
        if (a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA') && a.value) return;
        try { toast('天市已更新，正在载入新版本'); } catch (e) {}
        var sym = state && state.symbol;
        var url = location.pathname + location.search.replace(/([?&])symbol=[^&]*&?/, '$1').replace(/[?&]$/, '');
        if (sym) url += (url.indexOf('?') >= 0 ? '&' : '?') + 'symbol=' + encodeURIComponent(sym);
        setTimeout(function () { location.replace(url); }, 900);
      }).catch(function () {});
    }
    check();
    setInterval(check, 30000);
    document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') check(); });
    window.addEventListener('message', function (e) { if (e && e.data && e.data.type === 'tianshi:visibility' && e.data.visible) check(); });
  })();

  initChrome();
  firstPaintSkeleton();
  if ($('navHome')) $('navHome').addEventListener('click', function () { setView('market'); idle(); });
  if ($('backHome')) $('backHome').addEventListener('click', function () { setView('market'); idle(); });
  if ($('navMonster')) $('navMonster').addEventListener('click', function () { setView('monsters'); });
  if ($('navLadder')) $('navLadder').addEventListener('click', function () { setView('ladder'); });
  if ($('navPortfolio')) $('navPortfolio').addEventListener('click', function () { setView('portfolio'); });
  try {
    var vq = new URLSearchParams(location.search).get('view');
    if (vq === 'portfolio') setView('portfolio');
    else if (vq === 'monsters') { window.__wantMonsters = true; }
    else if (vq === 'ladder') { window.__wantLadder = true; }
  } catch (e) {}
  loadMarket().then(function () {
    hideBoot();
    if (window.__wantMonsters) setTimeout(function () { setView('monsters'); }, 30);
    if (window.__wantLadder) setTimeout(function () { setView('ladder'); }, 30);
  }).catch(function () {
    hideBoot();
    if (window.__wantMonsters) setTimeout(function () { setView('monsters'); }, 30);
  });
  setTimeout(hideBoot, 900);
  selfCheck();
  startLive();
  setInterval(function () {
    if (!pageVisible) return;
    loadMarket();
    if (currentView === 'market') { var card = document.querySelector('#right .tracker-source'); if (card) renderTrackerNative(card); }
  }, 60000);
  setInterval(selfCheck, 120000);
  var ft0 = $('footTime');
  if (ft0) ft0.textContent = '数据时点 —';
  setTimeout(resize, 30);
  // 深链：?symbol=600519 可直接打开某只票（也便于分享）
  var deep = null;
  try { deep = new URLSearchParams(location.search).get('symbol'); } catch (e) {}
  if (deep && /^\d{6}$/.test(deep)) { $('q').value = deep; load(deep); }
  else idle();
  document.addEventListener('keydown', function (e) {
    if (e.key === '/' && document.activeElement !== $('q')) { e.preventDefault(); $('q').focus(); $('q').select(); }
  });
})();
</script>
</body>
</html>
